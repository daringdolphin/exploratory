      const value = values[control.id];
      if (control.type === "toggle") return value ? 1 : 0;
      if (control.type === "slider" || control.type === "stepper") {
        const min = Number(control.min || 0);
        const max = Number(control.max || 100);
        return clamp((Number(value) - min) / Math.max(1, max - min), 0, 1);
      }
      const options = control.options || [];
      const index = Math.max(0, options.indexOf(String(value)));
      return options.length <= 1 ? 0 : index / (options.length - 1);
    }

    function activeControlIds() {
      const scenario = currentScenario();
      if (!scenario) return new Set();
      if (!scenario.active_controls.length) {
        return new Set(spec.controls.map(function(control) { return control.id; }));
      }
      return new Set(scenario.active_controls);
    }

    function isControlLocked(control) {
      const scenario = currentScenario();
      if (!scenario) return true;
      return !predictionMade ||
        scenario.locked_controls.indexOf(control.id) >= 0 ||
        !activeControlIds().has(control.id);
    }

    function computeMetrics() {
      let collisionFrequency = 1;
      let successfulFraction = 0.34;
      let activationEnergy = 1;
      let particleSpeed = 1;
      let density = 0.45;
      let symbolicLabel = "linked";
      const words = keywordText();

      spec.controls.forEach(function(control) {
        const norm = controlNorm(control);
        const effect = (control.id + " " + control.label + " " + control.affects.join(" ")).toLowerCase();
        const active = activeControlIds().has(control.id);
        const weight = active || predictionMade ? 1 : 0.55;

        if (/temperature|kinetic|speed|thermal|heat/.test(effect)) {
          particleSpeed += norm * 1.35 * weight;
          collisionFrequency += norm * 0.35 * weight;
          successfulFraction += norm * 0.42 * weight;
          symbolicLabel = "energy";
        }

        if (/concentration|pressure|density|surface|area|particle_count|frequency|volume|contact/.test(effect)) {
          collisionFrequency += norm * 1.08 * weight;
          density += norm * 0.42 * weight;
          symbolicLabel = "frequency";
        }

        if (/catalyst|activation|barrier|alternative/.test(effect)) {
          const activeCatalyst = control.type === "toggle" ? Boolean(values[control.id]) : norm > 0.45;
          if (activeCatalyst) {
            activationEnergy -= 0.36 * weight;
            successfulFraction += 0.34 * weight;
            symbolicLabel = "lower Ea";
          }
        }

        if (/electron|charge|ion|shell|proton|nucleon|isotope|mass/.test(effect)) {
          collisionFrequency += norm * 0.18 * weight;
          successfulFraction += norm * 0.16 * weight;
          density += norm * 0.16 * weight;
          symbolicLabel = /isotope|mass|nucleon/.test(effect) ? "mass number" : "charge";
        }
      });

      if (/rate|collision|activation|catalyst|temperature|concentration|pressure|surface/.test(words)) {
        symbolicLabel = symbolicLabel === "linked" ? "Ea" : symbolicLabel;
      }

      activationEnergy = clamp(activationEnergy, 0.48, 1.35);
      successfulFraction = clamp(successfulFraction / activationEnergy, 0.08, 0.94);
      collisionFrequency = clamp(collisionFrequency, 0.42, 3.8);
      density = clamp(density, 0.18, 1.2);
      particleSpeed = clamp(particleSpeed, 0.55, 3.2);
      const rate = clamp(collisionFrequency * successfulFraction, 0.1, 3.9);

      return {
        collisionFrequency: collisionFrequency,
        successfulFraction: successfulFraction,
        activationEnergy: activationEnergy,
        particleSpeed: particleSpeed,
        density: density,
        rate: rate,
        symbolicLabel: symbolicLabel
      };
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      resetParticles();
    }

    function resetParticles() {
      particles.length = 0;
      const width = canvas.clientWidth || 900;
      const height = canvas.clientHeight || 500;
      const count = 72;
      for (let i = 0; i < count; i += 1) {
        const symbol = spec.key_symbols[i % spec.key_symbols.length] || { role: "neutral", symbol: "particle" };
        const angle = rand() * Math.PI * 2;
        particles.push({
          x: 34 + rand() * Math.max(1, width * 0.56 - 68),
          y: 66 + rand() * Math.max(1, height - 150),
          vx: Math.cos(angle) * (18 + rand() * 42),
          vy: Math.sin(angle) * (18 + rand() * 42),
          r: 4.5 + rand() * 4.5,
          role: symbol.role,
          phase: rand() * Math.PI * 2
        });
      }
    }

    function renderPrediction() {
      const scenario = currentScenario();

      document.getElementById("scenario-title").textContent = scenario.title;

    function renderControls() {
      controlsEl.replaceChildren();
      const scenario = currentScenario();
      document.getElementById("control-hint").textContent = predictionMade
        ? "Only the scenario controls are active. Locked controls stay fixed so the chemistry stays traceable."
        : "Choose a prediction to unlock this scenario's controls.";

      spec.controls.forEach(function(control) {
        const locked = isControlLocked(control);
        const item = document.createElement("div");
        item.className = "control-card";
        item.setAttribute("aria-disabled", locked ? "true" : "false");

        const label = document.createElement("div");
        label.className = "control-label";
        const name = document.createElement("span");
        name.textContent = control.label;
        const value = document.createElement("span");
        value.textContent = formatControlValue(control);
        label.append(name, value);
        item.append(label);

        if (scenario.locked_controls.indexOf(control.id) >= 0) {
          const note = document.createElement("small");
          note.textContent = "Fixed in this scenario";
          item.append(note);
        }

        if (control.type === "slider" || control.type === "stepper") {
          const input = document.createElement("input");
          input.type = "range";
          input.min = String(control.min || 0);
          input.max = String(control.max || 100);
          input.step = String(control.step || 1);
          input.value = String(values[control.id]);
          input.disabled = locked;
          input.addEventListener("input", function(event) {
            values[control.id] = Number(event.target.value);
            renderControls();
          });
          item.append(input);
        } else if (control.type === "toggle") {
          const button = document.createElement("button");
          button.type = "button";
          button.disabled = locked;
          button.setAttribute("aria-pressed", values[control.id] ? "true" : "false");
          button.textContent = values[control.id] ? "On" : "Off";
          button.addEventListener("click", function() {
            values[control.id] = !values[control.id];
            renderControls();
          });
          item.append(button);
        } else if (control.type === "discrete") {
          const group = document.createElement("div");
          group.className = "discrete-options";
          (control.options || []).forEach(function(option) {
            const button = document.createElement("button");
            button.type = "button";
            button.disabled = locked;
            button.setAttribute("aria-current", values[control.id] === option ? "true" : "false");
            button.textContent = option;
            button.addEventListener("click", function() {
              values[control.id] = option;
              renderControls();
            });
            group.append(button);
          });
          item.append(group);
        } else {
          const select = document.createElement("select");
          select.disabled = locked;
          (control.options || []).forEach(function(option) {
            const choice = document.createElement("option");
            choice.value = option;
            choice.textContent = option;
            select.append(choice);
          });
          select.value = String(values[control.id]);
          select.addEventListener("change", function(event) {
            values[control.id] = event.target.value;
            renderControls();
          });
          item.append(select);
        }

        controlsEl.append(item);
      });
    }

    function formatControlValue(control) {
      const value = values[control.id];
      if (control.type === "toggle") return value ? "On" : "Off";
      return String(value);
    }

    function renderMisconceptions() {

    function renderCheckpoint() {
      checkpointEl.replaceChildren();
      const scenario = currentScenario();
      const checkpoint = spec.checkpoints.find(function(item) {
        return item.after_scenario === scenario.id;
      });

      if (!checkpoint) {
        const empty = document.createElement("p");
        empty.textContent = predictionMade
          ? "No checkpoint here. Move to the next scenario when you can explain what changed."
          : "A checkpoint appears after the relevant scenario.";
        checkpointEl.append(empty);
        return;
      }

      const block = document.createElement("div");
      block.className = "checkpoint";
      const prompt = document.createElement("strong");
      prompt.textContent = checkpoint.prompt;
      block.append(prompt);

      if (checkpoint.type === "fill_in_blank") {
        const input = document.createElement("input");
        input.placeholder = "Type the missing term(s)";
        input.value = checkpointState[checkpoint.id] || "";
        input.addEventListener("input", function(event) {
          checkpointState[checkpoint.id] = event.target.value;
        });
        block.append(input);
      } else if (checkpoint.type === "matching") {
        checkpoint.pairs.forEach(function(pair, index) {
          const select = document.createElement("select");
          select.dataset.answer = pair.mechanism;
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = pair.factor + ": choose mechanism";
          select.append(placeholder);
          checkpoint.pairs.forEach(function(option) {
            const choice = document.createElement("option");
            choice.value = option.mechanism;
            choice.textContent = option.mechanism;
            select.append(choice);
          });
          select.value = checkpointState[checkpoint.id + "-" + index] || "";
          select.addEventListener("change", function(event) {
            checkpointState[checkpoint.id + "-" + index] = event.target.value;
          });
          block.append(select);
        });
      } else {
        const group = document.createElement("div");
        group.className = "discrete-options";
        checkpoint.options.forEach(function(option) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = option;
          button.setAttribute("aria-current", checkpointState[checkpoint.id] === option ? "true" : "false");
          button.addEventListener("click", function() {
            checkpointState[checkpoint.id] = option;
            renderCheckpoint();
          });
          group.append(button);
        });
        block.append(group);
      }

      const actions = document.createElement("div");
      actions.className = "checkpoint-actions";
      const check = document.createElement("button");
      check.type = "button";
      check.textContent = "Check";
      const feedback = document.createElement("p");
      feedback.className = "checkpoint-feedback";
      check.addEventListener("click", function() {
        feedback.textContent = checkpointIsCorrect(checkpoint, block)
          ? "Good. You linked the observation to the mechanism."
          : "Not quite yet. Use the linked views to name the mechanism precisely.";
        feedback.style.color = checkpointIsCorrect(checkpoint, block) ? roleColors.good : roleColors.problem;
      });
      actions.append(check);
      block.append(actions, feedback);
      checkpointEl.append(block);
    }

    function checkpointIsCorrect(checkpoint, block) {
      if (checkpoint.type === "fill_in_blank") {
        const answer = String(checkpointState[checkpoint.id] || "").toLowerCase();
        return checkpoint.answers.every(function(expected) {
          return answer.indexOf(String(expected).toLowerCase()) >= 0;
        });
      }

      if (checkpoint.type === "matching") {
        const selects = Array.from(block.querySelectorAll("select"));
        return selects.every(function(select) {
          return select.value && select.value === select.dataset.answer;
        });
      }

      return checkpointState[checkpoint.id] === checkpoint.answer;
    }

    function syncMotionButton() {
      motionButton.textContent = motionRunning ? "Pause motion" : "Resume motion";

    function panel(x, y, w, h, title, subtitle) {
      ctx.fillStyle = "rgba(255, 253, 246, 0.94)";
      ctx.strokeStyle = "rgba(21, 25, 19, 0.18)";
      ctx.lineWidth = 1;
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);
      drawText(title, x + 14, y + 24, {
        color: roleColors.neutral,
        font: "800 12px Andale Mono, Courier New, monospace"
      });
      if (subtitle) {
        drawText(compact(subtitle, 48), x + 14, y + 43, {
          color: roleColors.inkSoft,
          font: "12px Avenir Next, Trebuchet MS, sans-serif"
        });
      }
    }

    function drawText(text, x, y, options) {
      const opts = options || {};
      ctx.save();
      ctx.fillStyle = opts.color || roleColors.neutral;
      ctx.font = opts.font || "800 12px Andale Mono, Courier New, monospace";
      ctx.textAlign = opts.align || "left";
      ctx.textBaseline = opts.baseline || "alphabetic";
      const maxWidth = opts.maxWidth || 999;
      const words = String(text).split(" ");
      let line = "";
      let yy = y;
      for (let i = 0; i < words.length; i += 1) {
        const test = line ? line + " " + words[i] : words[i];
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, yy);
          line = words[i];
          yy += opts.lineHeight || 16;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, x, yy);
      ctx.restore();
    }

    function drawArrow(x1, y1, x2, y2, color, width) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width || 2;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.translate(x2, y2);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-10, -5);
      ctx.lineTo(-10, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawMicroscopic(delta, time, x, y, w, h, metrics) {
      const micro = spec.representations.views.find(function(view) { return view.type === "microscopic"; });
      panel(x, y, w, h, "Microscopic", micro ? micro.description : "");

      const box = { x: x + 18, y: y + 58, w: w - 36, h: h - 90 };
      ctx.fillStyle = "rgba(226, 238, 232, 0.62)";
      ctx.strokeStyle = "rgba(21, 25, 19, 0.22)";
      ctx.lineWidth = 2;
      ctx.fillRect(box.x, box.y, box.w, box.h);
      ctx.strokeRect(box.x, box.y, box.w, box.h);

      const activeCount = Math.round(clamp(24 + metrics.density * 38, 18, particles.length));
      for (let i = 0; i < activeCount; i += 1) {
        const particle = particles[i];
        if (motionRunning) {
          particle.x += particle.vx * delta * metrics.particleSpeed;
          particle.y += particle.vy * delta * metrics.particleSpeed;
        }

        if (particle.x < box.x + particle.r || particle.x > box.x + box.w - particle.r) particle.vx *= -1;
        if (particle.y < box.y + particle.r || particle.y > box.y + box.h - particle.r) particle.vy *= -1;
        particle.x = clamp(particle.x, box.x + particle.r, box.x + box.w - particle.r);
        particle.y = clamp(particle.y, box.y + particle.r, box.y + box.h - particle.r);

        const successful = i % Math.max(2, Math.round(8 - metrics.rate)) === 0;
        ctx.globalAlpha = predictionMade ? 0.88 : 0.42;
        ctx.fillStyle = roleColors[particle.role] || roleColors.neutral;
        ctx.strokeStyle = successful ? roleColors.highlight : "rgba(21, 25, 19, 0.34)";
        ctx.lineWidth = successful ? 2.2 : 1;
        ctx.beginPath();
        ctx.arc(
          particle.x,
          particle.y,
          particle.r + Math.sin(time * 0.004 + particle.phase) * (motionRunning ? 0.9 : 0.2),
          0,
          Math.PI * 2
        );
        ctx.fill();
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      if (predictionMade && motionRunning && rand() < metrics.rate * 0.025) {
        pulses.push({
          x: box.x + rand() * box.w,
          y: box.y + rand() * box.h,
          age: 0
        });
      }

      drawText("successful collisions flash", box.x + 12, box.y + box.h - 14, {
        color: roleColors.inkSoft,
        font: "800 11px Andale Mono, Courier New, monospace"
      });
    }

    function drawMacroscopic(x, y, w, h, metrics) {
      const macro = spec.representations.views.find(function(view) { return view.type === "macroscopic"; });
      panel(x, y, w, h, "Macroscopic", macro ? macro.description : "");

      const gx = x + 42;
      const gy = y + h - 42;
      const gw = w - 76;
      const gh = h - 92;
      ctx.strokeStyle = roleColors.neutral;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx, gy - gh);
      ctx.lineTo(gx, gy);
      ctx.lineTo(gx + gw, gy);
      ctx.stroke();

      const decreasing = /reactant|mass loss|mass decreases|used up/i.test(spec.topic + " " + spec.mechanism);
      ctx.strokeStyle = roleColors.resolution;
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let i = 0; i <= 80; i += 1) {
        const t = i / 80;
        const curve = decreasing
          ? Math.exp(-metrics.rate * t * 1.2)
          : 1 - Math.exp(-metrics.rate * t * 1.2);
        const px = gx + t * gw;
        const py = decreasing
          ? gy - curve * gh * 0.86
          : gy - curve * gh * 0.86;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      const slopeX = gx + gw * 0.16;
      const slopeY = decreasing
        ? gy - Math.exp(-metrics.rate * 0.16 * 1.2) * gh * 0.86
        : gy - (1 - Math.exp(-metrics.rate * 0.16 * 1.2)) * gh * 0.86;
      drawArrow(slopeX - 26, slopeY + 28, slopeX + 34, slopeY - 28, roleColors.highlight, 3);
      drawText("initial gradient = rate", slopeX + 8, slopeY - 38, {
        color: roleColors.highlight,
        font: "800 11px Andale Mono, Courier New, monospace",
        maxWidth: 120
      });
      drawText(decreasing ? "[reactant] / mass" : "product amount", gx - 28, gy - gh - 8, {
        color: roleColors.inkSoft,
        font: "800 10px Andale Mono, Courier New, monospace"
      });
      drawText("time", gx + gw - 22, gy + 24, {
        color: roleColors.inkSoft,
        font: "800 10px Andale Mono, Courier New, monospace"
      });
    }

    function drawSymbolic(x, y, w, h, metrics) {
      const symbolic = spec.representations.views.find(function(view) { return view.type === "symbolic"; });
      panel(x, y, w, h, "Symbolic", symbolic ? symbolic.description : "");
      const words = keywordText();

      if (/electron|charge|ion|shell|proton|nucleon|isotope|relative atomic mass/.test(words)) {
        drawAtomicSymbolic(x, y, w, h, metrics);
      } else {
        drawEnergySymbolic(x, y, w, h, metrics);
      }
    }

    function drawEnergySymbolic(x, y, w, h, metrics) {
      const baseY = y + h - 48;
      const startX = x + 34;
      const endX = x + w - 32;
      const peakX = x + w * 0.48;
      const peakY = y + 74 + metrics.activationEnergy * 48;
      ctx.strokeStyle = roleColors.agent;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(startX, baseY - 20);
      ctx.bezierCurveTo(x + w * 0.28, y + 74, peakX, peakY - 92, peakX, peakY - 48);
      ctx.bezierCurveTo(x + w * 0.66, peakY + 16, x + w * 0.72, baseY - 76, endX, baseY - 76);
      ctx.stroke();

      if (metrics.activationEnergy < 0.78) {
        ctx.strokeStyle = roleColors.good;
        ctx.setLineDash([7, 8]);
        ctx.beginPath();
        ctx.moveTo(startX, baseY - 20);
        ctx.bezierCurveTo(x + w * 0.32, y + 112, peakX, peakY - 58, peakX, peakY - 24);
        ctx.bezierCurveTo(x + w * 0.66, peakY + 28, x + w * 0.72, baseY - 76, endX, baseY - 76);
        ctx.stroke();
        ctx.setLineDash([]);
        drawText("catalyst lowers Ea", peakX - 58, peakY + 8, {
          color: roleColors.good,
          font: "800 11px Andale Mono, Courier New, monospace"
        });
      }

      ctx.strokeStyle = roleColors.highlight;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(startX + 22, baseY - 20);
      ctx.lineTo(startX + 22, peakY - 48);
      ctx.stroke();
      drawText("Ea", startX + 30, (baseY + peakY) / 2 - 34, {
        color: roleColors.highlight,
        font: "800 16px Georgia, serif"
      });

      const distX = x + w - 138;
      const distY = y + 76;
      const distW = 106;
      const distH = 54;
      ctx.strokeStyle = roleColors.rule;
      ctx.strokeRect(distX, distY, distW, distH);
      ctx.fillStyle = "rgba(8, 122, 138, 0.18)";
      ctx.beginPath();
      for (let i = 0; i <= 36; i += 1) {
        const t = i / 36;
        const px = distX + t * distW;
        const py = distY + distH - Math.sin(t * Math.PI) * distH * (0.35 + metrics.successfulFraction * 0.62);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.lineTo(distX + distW, distY + distH);
      ctx.lineTo(distX, distY + distH);
      ctx.closePath();
      ctx.fill();
      drawText("fraction >= Ea", distX + 8, distY + distH + 16, {
        color: roleColors.inkSoft,
        font: "800 10px Andale Mono, Courier New, monospace"
      });
    }

    function drawAtomicSymbolic(x, y, w, h, metrics) {
      const cx = x + w * 0.36;
      const cy = y + h * 0.56;
      const shellCount = 2 + Math.round(metrics.density);
      ctx.strokeStyle = roleColors.rule;
      ctx.lineWidth = 2;
      for (let shell = 1; shell <= shellCount; shell += 1) {
        ctx.beginPath();
        ctx.arc(cx, cy, 28 + shell * 24, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = roleColors.problem;
      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, Math.PI * 2);
      ctx.fill();
      drawText("nucleus", cx, cy + 4, {
        align: "center",
        color: roleColors.paper,
        font: "800 10px Andale Mono, Courier New, monospace"
      });

      const electrons = 6 + Math.round(metrics.successfulFraction * 8);
      for (let i = 0; i < electrons; i += 1) {
        const shell = 1 + (i % shellCount);
        const angle = (i / electrons) * Math.PI * 2;
        const radius = 28 + shell * 24;
        const ex = cx + Math.cos(angle) * radius;
        const ey = cy + Math.sin(angle) * radius;
        ctx.fillStyle = roleColors.agent;
        ctx.beginPath();
        ctx.arc(ex, ey, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      const notationX = x + w * 0.66;
      drawText("proton no.", notationX, y + 88, {
        color: roleColors.inkSoft,
        font: "800 11px Andale Mono, Courier New, monospace"
      });
      drawText("X", notationX + 34, y + 148, {
        color: roleColors.neutral,
        font: "700 48px Georgia, serif"
      });
      drawText("nucleon no.", notationX, y + 190, {
        color: roleColors.inkSoft,
        font: "800 11px Andale Mono, Courier New, monospace"
      });
      drawText(metrics.symbolicLabel, notationX, y + h - 34, {
        color: roleColors.highlight,
        font: "800 13px Andale Mono, Courier New, monospace"
      });
    }

    function updateMetricReadouts(metrics) {
      document.getElementById("rate-readout").textContent = metrics.rate.toFixed(1) + "x";
      document.getElementById("metric-frequency").textContent = metrics.collisionFrequency.toFixed(1) + "x";
      document.getElementById("metric-success").textContent = Math.round(metrics.successfulFraction * 100) + "%";
      document.getElementById("metric-symbolic").textContent = metrics.symbolicLabel;
    }

    function draw(time) {
      animationId = null;
      const width = canvas.clientWidth || 900;
      const height = canvas.clientHeight || 500;
      const delta = Math.min(0.04, Math.max(0.001, (time - lastTime) / 1000 || 0.016));
      lastTime = time;
      const metrics = computeMetrics();
      updateMetricReadouts(metrics);

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = roleColors.paperStrong;
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = "rgba(202, 191, 158, 0.44)";
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      const gap = 12;
      if (width < 720) {
        const panelH = Math.max(150, (height - 48) / 3);
        drawMicroscopic(delta, time, 12, 12, width - 24, panelH, metrics);
        drawMacroscopic(12, 24 + panelH, width - 24, panelH, metrics);
        drawSymbolic(12, 36 + panelH * 2, width - 24, height - panelH * 2 - 48, metrics);
      } else {
        const leftW = Math.max(320, width * 0.58);
        const rightW = width - leftW - gap - 24;
        const topH = Math.max(190, (height - 36 - gap) * 0.5);
        drawMicroscopic(delta, time, 12, 12, leftW, height - 24, metrics);
        drawMacroscopic(leftW + gap + 12, 12, rightW, topH, metrics);
        drawSymbolic(leftW + gap + 12, topH + gap + 12, rightW, height - topH - gap - 24, metrics);
      }

      for (let i = pulses.length - 1; i >= 0; i -= 1) {
        const pulse = pulses[i];
        pulse.age += delta;
        const alpha = 1 - pulse.age / 0.72;
        if (alpha <= 0) {
          pulses.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = roleColors.highlight;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(pulse.x, pulse.y, 10 + pulse.age * 90, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      if (!document.hidden) scheduleDraw();
    }

    function scheduleDraw() {
      if (animationId === null) {
        animationId = requestAnimationFrame(draw);
      }
    }

    document.getElementById("prev-scenario").addEventListener("click", function() {
      setScenario(scenarioIndex - 1);
    });
    document.getElementById("next-scenario").addEventListener("click", function() {
      setScenario(scenarioIndex + 1);
    });
    document.getElementById("reset").addEventListener("click", resetArtifact);
    motionButton.addEventListener("click", function() {
      motionRunning = !motionRunning;
      syncMotionButton();
    });

    window.addEventListener("resize", resizeCanvas);
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        motionRunning = false;
        syncMotionButton();
        if (animationId !== null) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
      } else {
        lastTime = performance.now();
        scheduleDraw();
      }
    });
    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowLeft") setScenario(scenarioIndex - 1);
      if (event.key === "ArrowRight") setScenario(scenarioIndex + 1);
      if (event.key === "r" || event.key === "R") resetArtifact();
    });

    resetValues();
    renderStaticText();
    renderAll();
    resizeCanvas();
    scheduleDraw();
  </script>
</body>
</html>

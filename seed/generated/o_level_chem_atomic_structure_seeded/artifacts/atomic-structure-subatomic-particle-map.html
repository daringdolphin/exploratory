<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subatomic Particle Map</title>
  <style>
    :root {
      --problem: #c84a36;
      --agent: #087a8a;
      --resolution: #247c6f;
      --neutral: #151913;
      --highlight: #d79d1f;
      --good: #207857;
      --paper: #fff8ea;
      --paper-strong: #fffdf6;
      --surface: #f3e8d4;
      --surface-cool: #dfe9e2;
      --rule: #cabf9e;
      --muted: #626b5f;
      --shadow: #10201d;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background:
        linear-gradient(135deg, rgba(255, 248, 234, 0.98), rgba(223, 233, 226, 0.95) 54%, rgba(242, 225, 188, 0.78)),
        repeating-linear-gradient(0deg, rgba(21, 25, 19, 0.026) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(90deg, rgba(21, 25, 19, 0.022) 0 1px, transparent 1px 28px);
      color: var(--neutral);
      font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    }

    button,
    input,
    select {
      color: inherit;
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(8, 122, 138, 0.28);
      outline-offset: 2px;
    }

    .artifact {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      width: 100%;
      height: 100vh;
      min-height: 520px;
      padding: 9px;
      animation: settle 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
      min-height: 74px;
      border: 1px solid rgba(21, 25, 19, 0.14);
      background: rgba(255, 253, 246, 0.76);
      padding: 10px 12px;
    }

    .eyebrow,
    .source,
    .scenario-count,
    .control-label,
    .metric,
    .checkpoint button,
    .prediction button,
    .scenario-tab,
    .vocab-chip {
      font-family: "Andale Mono", "Courier New", monospace;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--agent);
      font-size: 10px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 3.1vw, 42px);
      line-height: 0.96;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .aha {
      max-width: 920px;
      max-height: 38px;
      margin: 5px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.28;
    }

    .source {
      align-self: stretch;
      display: grid;
      min-width: 118px;
      place-items: center;
      border-left: 1px solid rgba(21, 25, 19, 0.12);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-align: center;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(278px, 320px);
      gap: 8px;
      min-height: 0;
    }

    .stage,
    .side {
      min-width: 0;
      min-height: 0;
      border: 1px solid rgba(21, 25, 19, 0.14);
      background: rgba(255, 253, 246, 0.8);
      overflow: hidden;
    }

    .stage {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .canvas-wrap {
      position: relative;
      min-height: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid rgba(21, 25, 19, 0.12);
      background: rgba(21, 25, 19, 0.08);
      gap: 1px;
    }

    .metric {
      min-width: 0;
      background: rgba(255, 253, 246, 0.92);
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      padding: 7px 8px;
    }

    .metric strong {
      display: block;
      margin-bottom: 2px;
      color: var(--neutral);
      font-size: 16px;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: none;
    }

    .side {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      gap: 7px;
      padding: 9px;
    }

    .scenario-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .scenario-tab {
      min-height: 34px;
      border: 1px solid rgba(21, 25, 19, 0.14);
      background: rgba(255, 248, 234, 0.76);
      cursor: pointer;
      font-size: 9px;
      font-weight: 800;
      padding: 5px 7px;
      text-align: left;
    }

    .scenario-tab[aria-current="true"] {
      border-color: rgba(8, 122, 138, 0.62);
      background: var(--neutral);
      color: var(--paper);
    }

    .question {
      border-left: 5px solid var(--highlight);
      background: rgba(255, 248, 234, 0.76);
      padding: 8px 9px;
    }

    .scenario-count {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .question h2 {
      margin: 0 0 4px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1;
    }

    .question p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.28;
    }

    .prediction {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .prediction button,
    .checkpoint button {
      min-height: 30px;
      border: 1px solid rgba(21, 25, 19, 0.16);
      background: rgba(255, 253, 246, 0.82);
      cursor: pointer;
      font-size: 9px;
      font-weight: 800;
      padding: 4px 6px;
    }

    .prediction button[aria-pressed="true"],
    .checkpoint button[aria-pressed="true"] {
      background: var(--agent);
      color: white;
    }

    .controls {
      display: grid;
      gap: 6px;
      min-height: 0;
      align-content: start;
    }

    .control {
      min-width: 0;
      border: 1px solid rgba(21, 25, 19, 0.12);
      background: rgba(255, 253, 246, 0.7);
      padding: 7px;
    }

    .control[aria-disabled="true"] {
      opacity: 0.48;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--neutral);
      font-size: 9px;
      font-weight: 800;
    }

    .control-label span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      margin: 5px 0 0;
      accent-color: var(--agent);
    }

    .choice-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(54px, 1fr));
      gap: 4px;
      margin-top: 6px;
    }

    .choice-row button,
    .toggle-button {
      min-height: 26px;
      border: 1px solid rgba(21, 25, 19, 0.15);
      background: rgba(255, 253, 246, 0.82);
      cursor: pointer;
      font-size: 10px;
      line-height: 1.1;
      padding: 3px 5px;
    }

    .choice-row button[aria-current="true"],
    .toggle-button[aria-pressed="true"] {
      background: var(--neutral);
      color: var(--paper);
    }

    .checkpoint {
      border-top: 1px solid rgba(21, 25, 19, 0.12);
      padding-top: 7px;
    }

    .checkpoint strong {
      display: block;
      color: var(--neutral);
      font-size: 11px;
      line-height: 1.25;
    }

    .checkpoint p,
    .feedback {
      min-height: 18px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.25;
    }

    .vocab {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 26px;
      overflow: hidden;
    }

    .vocab-chip {
      border: 1px solid rgba(21, 25, 19, 0.12);
      background: rgba(255, 248, 234, 0.72);
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
      padding: 4px 5px;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(8px) scale(0.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 760px) {
      .artifact {
        min-height: 720px;
      }

      .topbar,
      .main {
        grid-template-columns: minmax(0, 1fr);
      }

      .source {
        display: none;
      }

      .main {
        grid-template-rows: minmax(0, 1fr) 330px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="artifact">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p class="aha" id="aha"></p>
      </div>
      <div class="source" id="source"></div>
    </header>

    <section class="main" aria-label="Interactive teaching artifact">
      <article class="stage">
        <div class="canvas-wrap">
          <canvas id="scene" aria-label="Subatomic Particle Map interactive visual"></canvas>
        </div>
        <div class="metrics">
          <div class="metric"><strong id="metric-one">-</strong><span id="metric-one-label">micro view</span></div>
          <div class="metric"><strong id="metric-two">-</strong><span id="metric-two-label">macro view</span></div>
          <div class="metric"><strong id="metric-three">-</strong><span id="metric-three-label">symbolic view</span></div>
        </div>
      </article>

      <aside class="side">
        <div class="scenario-tabs" id="scenario-tabs"></div>
        <section class="question">
          <p class="scenario-count" id="scenario-count"></p>

          <p id="scenario-question"></p>
        </section>
        <div class="prediction" id="prediction"></div>
        <div class="controls" id="controls"></div>
        <section class="checkpoint" id="checkpoint"></section>
        <div class="vocab" id="vocab"></div>
      </aside>
    </section>
  </main>

  <script>
    const spec = {"id":"atomic-structure-subatomic-particle-map","source_ref":"page 3","subject":"O Level Chemistry","topic":"Subatomic particles","medium":"interactive_html","mechanism":"Protons and neutrons sit in the nucleus while electrons occupy shells; their charge and relative mass decide how atoms are counted and compared.","transferable_principle":"Before reasoning about atoms, separate each particle by charge, relative mass, symbol, and location.","steps":[{"name":"Place the particles","beat":"Show protons and neutrons clustered in the nucleus, with electrons animated on shells around it."},{"name":"Compare charges","beat":"Highlight proton +1, neutron 0, and electron -1 while a net-charge meter updates."},{"name":"Compare masses","beat":"Make protons and neutrons count as relative mass 1 while the electron mass is shown as negligible."},{"name":"Link symbols","beat":"Attach p, n, and e labels to the particle table so students connect diagram and notation."}],"key_symbols":[{"symbol":"p","role":"agent","meaning":"Proton: +1 charge, relative mass 1, found in the nucleus."},{"symbol":"n","role":"neutral","meaning":"Neutron: no charge, relative mass 1, found in the nucleus."},{"symbol":"e","role":"problem","meaning":"Electron: -1 charge, negligible relative mass, found in electron shells."},{"symbol":"nucleus","role":"highlight","meaning":"The central region containing protons and neutrons."},{"symbol":"electron shell","role":"resolution","meaning":"The region outside the nucleus where electrons are arranged."}],"interactivity_hooks":["Switch particle focus to animate where each particle belongs.","Toggle charge and mass overlays to compare what each particle contributes.","Run a quick sort challenge that asks whether a particle belongs in the nucleus or shell."],"output_filename":"atomic-structure-subatomic-particle-map.html","artifact_metadata":{"title":"Subatomic Particle Map","subject":"O Level Chemistry","level":"O Level Chemistry","syllabus_reference":"MOE 6092 Chemistry: Atomic Structure","estimated_interaction_time_minutes":5,"prerequisite_concepts":["Atoms contain subatomic particles","Positive and negative charges can cancel"]},"learning_design":{"core_aha":"I can tell what each particle does by asking four questions: charge, mass, symbol, and location.","learning_objectives":["Students distinguish protons, neutrons, and electrons before using them in charge, isotope, and notation reasoning.","Given a particle name or symbol, state its charge, relative mass, and location without mixing nucleus and shell roles.","Before reasoning about atoms, separate each particle by charge, relative mass, symbol, and location."],"target_misconceptions":[{"misconception":"Electrons are found in the nucleus.","correction":"Electrons are found in electron shells; only protons and neutrons are in the nucleus.","addressed_in_scenario_id":"locate_nucleus_particles"},{"misconception":"Neutrons affect charge because they are in the nucleus.","correction":"Electrons are found in electron shells; only protons and neutrons are in the nucleus.","addressed_in_scenario_id":"locate_nucleus_particles"},{"misconception":"Electrons contribute the same relative mass as protons and neutrons.","correction":"Electrons are found in electron shells; only protons and neutrons are in the nucleus.","addressed_in_scenario_id":"locate_nucleus_particles"},{"misconception":"Particle symbols p, n, and e are interchangeable labels rather than specific particles.","correction":"Electrons are found in electron shells; only protons and neutrons are in the nucleus.","addressed_in_scenario_id":"locate_nucleus_particles"}]},"representations":{"description":"All views are linked: changing a control updates the particle/subatomic view, the observable outcome, and the symbolic notation or table.","views":[{"id":"microscopic_atom_view","type":"microscopic","description":"A nucleus with protons and neutrons, plus electrons moving on shells."},{"id":"charge_balance_meter","type":"macroscopic","description":"The net charge contribution when the focused particle count changes."},{"id":"symbolic_particle_table","type":"symbolic","description":"p, n, and e matched to charge, relative mass, and location."},{"id":"mass_comparison_bar","type":"macroscopic","description":"Relative mass comparison: proton 1, neutron 1, electron negligible."}]},"controls":[{"id":"particle_focus","label":"Particle focus","type":"discrete","default":"proton","options":["proton","neutron","electron"],"affects":["microscopic_atom_view","symbolic_particle_table","particle_charge_labels"]},{"id":"show_charge_overlay","label":"Show charge","type":"toggle","default":true,"affects":["charge_balance_meter","particle_charge_labels"]},{"id":"show_mass_overlay","label":"Show relative mass","type":"toggle","default":false,"affects":["mass_comparison_bar","symbolic_particle_table"]},{"id":"particle_sort_mode","label":"Sort challenge","type":"toggle","default":false,"affects":["microscopic_atom_view","checkpoint_particle_location"]}],"scenarios":[{"id":"locate_nucleus_particles","title":"Nucleus or shell?","guiding_question":"Which particles should stay inside the nucleus?","locked_controls":["show_charge_overlay","show_mass_overlay"],"active_controls":["particle_focus"],"success_criterion":"Student identifies protons and neutrons in the nucleus and electrons in shells.","misconception_buster":true},{"id":"read_charge_roles","title":"Charge contribution","guiding_question":"Which particle changes the charge meter upward, downward, or not at all?","locked_controls":["show_charge_overlay"],"active_controls":["particle_focus"],"success_criterion":"Student links proton to +1, electron to -1, and neutron to 0 charge."},{"id":"mass_is_not_charge","title":"Mass is separate","guiding_question":"Which particles count toward almost all atomic mass?","locked_controls":["show_mass_overlay"],"active_controls":["particle_focus"],"success_criterion":"Student explains that protons and neutrons have relative mass 1 while electron mass is negligible.","misconception_buster":true},{"id":"free_particle_compare","title":"Free compare","guiding_question":"Can you build a complete particle profile from the table and diagram?","locked_controls":[],"active_controls":["particle_focus","show_charge_overlay","show_mass_overlay","particle_sort_mode"],"success_criterion":"Student can state charge, relative mass, symbol, and location for the selected particle."}],"checkpoints":[{"id":"checkpoint_particle_location","after_scenario":"locate_nucleus_particles","prompt":"A student says electrons are in the nucleus because atoms are tiny. What should you correct?","type":"fill_in_blank","answers":["Electrons are found in electron shells"]},{"id":"checkpoint_particle_summary","after_scenario":"read_charge_roles","prompt":"Complete the sentence: Proton is ___, neutron is ___, electron is ___.","type":"fill_in_blank","answers":["Proton is positive in the nucleus, neutron is neutral in the nucleus, electro..."]}],"ui_requirements":{"always_visible":["reset_button","current_scenario_title","rate_readout"],"syllabus_vocabulary_to_surface":["proton number","nucleon number","isotopes","relative atomic mass","ions","electronic configuration","charge","shells","electrons"],"tone":"Clear, direct, no childish language. Treat students as capable.","accessibility":["colourblind-safe palette","labels not just colours","keyboard-navigable controls","Use shape and labels in addition to colour for charge and location."]}};
    const roleLabels = {"problem":"Trap","agent":"Cause","resolution":"Outcome","neutral":"Structure","highlight":"Focus"};
    const roleColors = {
      problem: "#c84a36",
      agent: "#087a8a",
      resolution: "#247c6f",
      neutral: "#151913",
      highlight: "#d79d1f",
      good: "#207857",
      paper: "#fff8ea",
      paperStrong: "#fffdf6",
      surface: "#f3e8d4",
      surfaceCool: "#dfe9e2",
      rule: "#cabf9e",
      muted: "#626b5f"
    };

    const predictionChoices = ["Increase", "Decrease", "Stay same", "It depends"];
    const values = {};
    const checkpointState = {};
    let scenarioIndex = 0;
    let predictionMade = false;
    let selectedPrediction = "";
    let motion = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let animationId = null;
    let lastTime = 0;
    let timeSeed = 0;

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const scenarioTabs = document.getElementById("scenario-tabs");
    const controlsEl = document.getElementById("controls");
    const predictionEl = document.getElementById("prediction");
    const checkpointEl = document.getElementById("checkpoint");

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function compact(value, max) {
      const text = String(value || "");
      return text.length > max ? text.slice(0, max - 3).trim() + "..." : text;
    }

    function currentScenario() {
      return spec.scenarios[scenarioIndex] || spec.scenarios[0];
    }

    function controlById(id) {
      return spec.controls.find(function(control) { return control.id === id; });
    }

    function defaultValue(control) {
      if (control.default !== undefined) return control.default;
      if (control.type === "toggle") return false;
      if (control.type === "slider" || control.type === "stepper") return control.min || 0;
      return control.options && control.options.length ? control.options[0] : "";
    }

    function resetValues() {
      spec.controls.forEach(function(control) {
        values[control.id] = defaultValue(control);
      });
    }

    function getValue(id, fallback) {
      return values[id] === undefined ? fallback : values[id];
    }

    function setMetric(one, oneLabel, two, twoLabel, three, threeLabel) {
      document.getElementById("metric-one").textContent = one;
      document.getElementById("metric-one-label").textContent = oneLabel;
      document.getElementById("metric-two").textContent = two;
      document.getElementById("metric-two-label").textContent = twoLabel;
      document.getElementById("metric-three").textContent = three;
      document.getElementById("metric-three-label").textContent = threeLabel;
    }

    function activeControlIds() {
      const scenario = currentScenario();
      if (!scenario || !scenario.active_controls.length) return new Set();
      return new Set(scenario.active_controls);
    }

    function isLocked(control) {
      const scenario = currentScenario();
      if (!scenario) return true;
      return !predictionMade ||
        scenario.locked_controls.indexOf(control.id) >= 0 ||
        !activeControlIds().has(control.id);
    }

    function controlNorm(id, fallback) {
      const control = controlById(id);
      if (!control) return fallback || 0;
      const value = getValue(id, control.default);
      if (control.type === "toggle") return value ? 1 : 0;
      if (control.type === "slider" || control.type === "stepper") {
        return clamp((Number(value) - Number(control.min || 0)) / Math.max(1, Number(control.max || 100) - Number(control.min || 0)), 0, 1);
      }
      const options = control.options || [];
      const index = Math.max(0, options.indexOf(String(value)));
      return options.length <= 1 ? 0 : index / (options.length - 1);
    }

    function applyControlSideEffects(id) {
      const presetAtoms = {
        hydrogen: 1,
        sodium: 11,
        chlorine: 17,
        argon: 18,
        calcium: 20
      };
      const elementData = {
        Ca: { z: 20, a: 40 },
        Cl: { z: 17, a: 35 },
        Na: { z: 11, a: 23 },
        Og: { z: 118, a: 294 }
      };

      if (id === "atom_preset" && presetAtoms[String(values.atom_preset)]) {
        values.electron_count = presetAtoms[String(values.atom_preset)];
      }

      if (id === "element_symbol" && elementData[String(values.element_symbol)]) {
        values.proton_number = elementData[String(values.element_symbol)].z;
        values.nucleon_number = elementData[String(values.element_symbol)].a;
      }
    }

    function shellFill(electrons) {
      let remaining = Math.max(0, Math.round(electrons));
      const caps = [2, 8, 8, 18];
      return caps.map(function(cap) {
        const used = Math.min(cap, remaining);
        remaining -= used;
        return used;
      }).filter(function(count, index) {
        return count > 0 || index < 2;
      });
    }

    function chargeNumber(label) {
      const value = String(label || "atom");
      if (value === "atom" || value === "neutral") return 0;
      if (value.indexOf("+") >= 0) return Number(value.replace("+", "")) || 1;
      if (value.indexOf("-") >= 0) return -1 * (Number(value.replace("-", "")) || 1);
      return 0;
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function renderStatic() {
      document.getElementById("eyebrow").textContent = spec.artifact_metadata.level + " / " + spec.subject;
      document.getElementById("source").textContent = spec.source_ref;
      document.getElementById("title").textContent = spec.artifact_metadata.title || spec.topic;
      document.getElementById("aha").textContent = spec.learning_design.core_aha;

      const vocab = document.getElementById("vocab");
      vocab.replaceChildren();
      spec.ui_requirements.syllabus_vocabulary_to_surface.slice(0, 8).forEach(function(term) {
        const chip = document.createElement("span");
        chip.className = "vocab-chip";
        chip.textContent = term;
        vocab.append(chip);
      });
    }

    function renderScenarios() {
      scenarioTabs.replaceChildren();
      spec.scenarios.slice(0, 4).forEach(function(scenario, index) {
        const button = document.createElement("button");
        button.className = "scenario-tab";
        button.type = "button";
        button.textContent = String(index + 1).padStart(2, "0") + " " + scenario.title;
        button.setAttribute("aria-current", index === scenarioIndex ? "true" : "false");
        button.addEventListener("click", function() {
          scenarioIndex = index;
          predictionMade = false;
          selectedPrediction = "";
          renderAll();
        });
        scenarioTabs.append(button);
      });
    }

    function renderQuestion() {
      const scenario = currentScenario();
      document.getElementById("scenario-count").textContent = "Scenario " + (scenarioIndex + 1) + " / " + spec.scenarios.length;
      document.getElementById("scenario-title").textContent = scenario.title;
      document.getElementById("scenario-question").textContent = predictionMade
        ? (scenario.success_criterion || "Use the controls and link the three views.")
        : scenario.guiding_question;

      predictionEl.replaceChildren();
      if (!predictionMade) {
        predictionChoices.forEach(function(choice) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = choice;
          button.addEventListener("click", function() {
            predictionMade = true;
            selectedPrediction = choice;
            renderAll();
          });
          predictionEl.append(button);
        });
      } else {
        const left = document.createElement("button");
        left.type = "button";
        left.textContent = "Prediction: " + selectedPrediction;
        left.setAttribute("aria-pressed", "true");
        const reset = document.createElement("button");
        reset.type = "button";
        reset.textContent = "Reset";
        reset.addEventListener("click", function() {
          resetValues();
          predictionMade = false;
          selectedPrediction = "";
          renderAll();
        });
        predictionEl.append(left, reset);
      }
    }

    function renderControls() {
      controlsEl.replaceChildren();
      spec.controls.slice(0, 5).forEach(function(control) {
        const locked = isLocked(control);
        const item = document.createElement("div");
        item.className = "control";
        item.setAttribute("aria-disabled", locked ? "true" : "false");

        const label = document.createElement("div");
        label.className = "control-label";
        const name = document.createElement("span");
        name.textContent = control.label;
        const value = document.createElement("span");
        value.textContent = String(formatControlValue(control));
        label.append(name, value);
        item.append(label);

        if (control.type === "slider" || control.type === "stepper") {
          const input = document.createElement("input");
          input.type = "range";
          input.min = String(control.min || 0);
          input.max = String(control.max || 100);
          input.step = String(control.step || 1);
          input.value = String(values[control.id]);
          input.disabled = locked;
          input.addEventListener("input", function(event) {
            values[control.id] = Number(event.target.value);
            renderControls();
          });
          item.append(input);
        } else if (control.type === "toggle") {
          const button = document.createElement("button");
          button.className = "toggle-button";
          button.type = "button";
          button.disabled = locked;
          button.textContent = values[control.id] ? "On" : "Off";
          button.setAttribute("aria-pressed", values[control.id] ? "true" : "false");
          button.addEventListener("click", function() {
            values[control.id] = !values[control.id];
            renderControls();
          });
          item.append(button);
        } else {
          const group = document.createElement("div");
          group.className = "choice-row";
          (control.options || []).slice(0, 5).forEach(function(option) {
            const button = document.createElement("button");
            button.type = "button";
            button.disabled = locked;
            button.textContent = option;
            button.setAttribute("aria-current", String(values[control.id]) === option ? "true" : "false");
            button.addEventListener("click", function() {
              values[control.id] = option;
              applyControlSideEffects(control.id);
              renderControls();
            });
            group.append(button);
          });
          item.append(group);
        }

        controlsEl.append(item);
      });
    }

    function formatControlValue(control) {
      const value = values[control.id];
      if (control.type === "toggle") return value ? "On" : "Off";
      return value;
    }

    function renderCheckpoint() {
      checkpointEl.replaceChildren();
      const scenario = currentScenario();
      const checkpoint = spec.checkpoints.find(function(item) {
        return item.after_scenario === scenario.id;
      }) || spec.checkpoints[0];

      if (!checkpoint) return;

      const prompt = document.createElement("strong");
      prompt.textContent = checkpoint.prompt;
      checkpointEl.append(prompt);

      if (checkpoint.type === "multiple_choice") {
        const group = document.createElement("div");
        group.className = "choice-row";
        checkpoint.options.forEach(function(option) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = option;
          button.setAttribute("aria-pressed", checkpointState[checkpoint.id] === option ? "true" : "false");
          button.addEventListener("click", function() {
            checkpointState[checkpoint.id] = option;
            renderCheckpoint();
          });
          group.append(button);
        });
        checkpointEl.append(group);
      } else if (checkpoint.type === "matching") {
        checkpoint.pairs.slice(0, 3).forEach(function(pair) {
          const p = document.createElement("p");
          p.textContent = pair.factor + " -> " + pair.mechanism;
          checkpointEl.append(p);
        });
      } else {
        const p = document.createElement("p");
        p.textContent = "Say it aloud, then check the visual: " + checkpoint.answers.join(" / ");
        checkpointEl.append(p);
      }

      const feedback = document.createElement("p");
      feedback.className = "feedback";
      if (checkpoint.type === "multiple_choice" && checkpointState[checkpoint.id]) {
        feedback.textContent = checkpointState[checkpoint.id] === checkpoint.answer
          ? "Good. The explanation matches the mechanism."
          : "Not quite. Look for the view that changed first.";
        feedback.style.color = checkpointState[checkpoint.id] === checkpoint.answer ? roleColors.good : roleColors.problem;
      } else if (predictionMade) {
        feedback.textContent = currentScenario().prompt_after || "Checkpoint: connect particle change to the symbol.";
      } else {
        feedback.textContent = "Predict first; the checkpoint makes the mechanism explicit.";
      }
      checkpointEl.append(feedback);
    }

    function renderAll() {
      renderScenarios();
      renderQuestion();
      renderControls();
      renderCheckpoint();
    }

    function clearCanvas() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = roleColors.paperStrong;
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "rgba(202, 191, 158, 0.4)";
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function panel(x, y, w, h, title, subtitle, accent) {
      ctx.fillStyle = "rgba(255, 253, 246, 0.92)";
      ctx.strokeStyle = "rgba(21, 25, 19, 0.17)";
      ctx.lineWidth = 1;
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = accent || roleColors.agent;
      ctx.fillRect(x, y, 5, h);
      drawText(title, x + 14, y + 22, {
        color: roleColors.neutral,
        font: "800 12px Andale Mono, Courier New, monospace"
      });
      if (subtitle) {
        drawText(compact(subtitle, 70), x + 14, y + 40, {
          color: roleColors.muted,
          font: "11px Avenir Next, Trebuchet MS, sans-serif",
          maxWidth: w - 28
        });
      }
    }

    function drawText(text, x, y, options) {
      const opts = options || {};
      ctx.save();
      ctx.fillStyle = opts.color || roleColors.neutral;
      ctx.font = opts.font || "800 12px Andale Mono, Courier New, monospace";
      ctx.textAlign = opts.align || "left";
      ctx.textBaseline = opts.baseline || "alphabetic";
      const maxWidth = opts.maxWidth || 9999;
      const lineHeight = opts.lineHeight || 15;
      const words = String(text || "").split(" ");
      let line = "";
      let yy = y;
      for (let i = 0; i < words.length; i += 1) {
        const test = line ? line + " " + words[i] : words[i];
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, yy);
          line = words[i];
          yy += lineHeight;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, x, yy);
      ctx.restore();
    }

    function arrow(x1, y1, x2, y2, color, width) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.save();
      ctx.strokeStyle = color || roleColors.highlight;
      ctx.fillStyle = color || roleColors.highlight;
      ctx.lineWidth = width || 2;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.translate(x2, y2);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-9, -5);
      ctx.lineTo(-9, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function electronShells(cx, cy, shells, options) {
      const opts = options || {};
      const maxShells = Math.max(1, shells.length);
      ctx.save();
      for (let shell = 0; shell < maxShells; shell += 1) {
        const radius = opts.radiusBase || 32;
        const r = radius + shell * (opts.shellGap || 30);
        ctx.strokeStyle = roleColors.rule;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        const count = shells[shell] || 0;
        for (let i = 0; i < count; i += 1) {
          const angle = (i / Math.max(count, 1)) * Math.PI * 2 + timeSeed * (0.22 + shell * 0.05);
          const ex = cx + Math.cos(angle) * r;
          const ey = cy + Math.sin(angle) * r;
          ctx.fillStyle = opts.electronColor || roleColors.agent;
          ctx.beginPath();
          ctx.arc(ex, ey, opts.electronRadius || 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.fillStyle = opts.nucleusColor || roleColors.problem;
      ctx.beginPath();
      ctx.arc(cx, cy, opts.nucleusRadius || 22, 0, Math.PI * 2);
      ctx.fill();
      drawText(opts.nucleusLabel || "nucleus", cx, cy + 4, {
        align: "center",
        color: roleColors.paper,
        font: "800 10px Andale Mono, Courier New, monospace"
      });
      ctx.restore();
    }

    function drawParticleCluster(cx, cy, protons, neutrons, scale) {
      const total = Math.min(36, Math.max(6, protons + neutrons));
      const shownProtons = Math.round(total * protons / Math.max(1, protons + neutrons));
      for (let i = 0; i < total; i += 1) {
        const ring = Math.floor(Math.sqrt(i));
        const angle = i * 2.399 + timeSeed * 0.08;
        const r = ring * (scale || 7);
        ctx.fillStyle = i < shownProtons ? roleColors.problem : roleColors.neutral;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r, (scale || 7) * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function splitLayout() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const gap = 10;
      return {
        width: width,
        height: height,
        left: { x: 12, y: 12, w: Math.max(320, width * 0.56), h: height - 24 },
        topRight: { x: Math.max(320, width * 0.56) + gap + 12, y: 12, w: width - Math.max(320, width * 0.56) - gap - 24, h: (height - 34) * 0.5 },
        bottomRight: { x: Math.max(320, width * 0.56) + gap + 12, y: 22 + (height - 34) * 0.5, w: width - Math.max(320, width * 0.56) - gap - 24, h: (height - 34) * 0.5 }
      };
    }

    function drawGraph(x, y, w, h, rate, options) {
      const opts = options || {};
      const gx = x + 42;
      const gy = y + h - 36;
      const gw = w - 66;
      const gh = h - 84;
      ctx.strokeStyle = roleColors.neutral;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx, gy - gh);
      ctx.lineTo(gx, gy);
      ctx.lineTo(gx + gw, gy);
      ctx.stroke();
      ctx.strokeStyle = opts.color || roleColors.resolution;
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let i = 0; i <= 80; i += 1) {
        const t = i / 80;
        const value = opts.decreasing ? Math.exp(-rate * t * 1.3) : 1 - Math.exp(-rate * t * 1.3);
        const px = gx + t * gw;
        const py = opts.decreasing ? gy - value * gh * 0.86 : gy - value * gh * 0.86;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      if (opts.tangent !== false) {
        const tx = gx + gw * 0.2;
        const ty = opts.decreasing
          ? gy - Math.exp(-rate * 0.2 * 1.3) * gh * 0.86
          : gy - (1 - Math.exp(-rate * 0.2 * 1.3)) * gh * 0.86;
        arrow(tx - 26, ty + 24, tx + 34, ty - 24, roleColors.highlight, 3);
        drawText(opts.tangentLabel || "initial gradient", tx + 6, ty - 32, {
          color: roleColors.highlight,
          font: "800 11px Andale Mono, Courier New, monospace"
        });
      }
      drawText(opts.yLabel || "amount", gx - 22, gy - gh - 8, {
        color: roleColors.muted,
        font: "800 10px Andale Mono, Courier New, monospace"
      });
      drawText("time", gx + gw - 18, gy + 20, {
        color: roleColors.muted,
        font: "800 10px Andale Mono, Courier New, monospace"
      });
    }

    function drawSubatomic() {
      const l = splitLayout();
      const focus = String(getValue("particle_focus", "proton"));
      const showCharge = Boolean(getValue("show_charge_overlay", true));
      const showMass = Boolean(getValue("show_mass_overlay", false));
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Microscopic", "Choose one particle and watch where it belongs.", roleColors.agent);
      const cx = l.left.x + l.left.w * 0.46;
      const cy = l.left.y + l.left.h * 0.52;
      electronShells(cx, cy, [2, 6], {
        nucleusLabel: "p+n",
        nucleusRadius: 34,
        electronRadius: focus === "electron" ? 7 : 5,
        electronColor: focus === "electron" ? roleColors.highlight : roleColors.agent
      });
      drawParticleCluster(cx, cy, 6, 6, focus === "proton" || focus === "neutron" ? 10 : 7);
      drawText("protons + neutrons stay in the nucleus", l.left.x + 28, l.left.y + l.left.h - 28, { color: roleColors.muted, font: "800 12px Andale Mono, Courier New, monospace" });

      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Macroscopic", "Net charge comes from protons and electrons.", roleColors.resolution);
      const charge = focus === "proton" ? "+1" : focus === "electron" ? "-1" : "0";
      const mass = focus === "electron" ? "negligible" : "1";
      drawText(focus, l.topRight.x + 26, l.topRight.y + 82, { color: roleColors.neutral, font: "700 32px Georgia, serif" });
      drawText(showCharge ? "charge " + charge : "charge hidden", l.topRight.x + 26, l.topRight.y + 118, { color: roleColors.problem, font: "800 16px Andale Mono, Courier New, monospace" });
      drawText(showMass ? "relative mass " + mass : "mass hidden", l.topRight.x + 26, l.topRight.y + 146, { color: roleColors.agent, font: "800 16px Andale Mono, Courier New, monospace" });

      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Symbolic", "Do not mix symbol, charge, mass, and location.", roleColors.highlight);
      const symbols = { proton: "p", neutron: "n", electron: "e" };
      const places = { proton: "nucleus", neutron: "nucleus", electron: "shell" };
      drawText(symbols[focus] || "?", l.bottomRight.x + 34, l.bottomRight.y + 102, { color: roleColors.neutral, font: "700 54px Georgia, serif" });
      drawText("location: " + (places[focus] || "-"), l.bottomRight.x + 100, l.bottomRight.y + 92, { color: roleColors.muted, font: "800 13px Andale Mono, Courier New, monospace" });
      drawText("role: " + (roleLabels[focus === "electron" ? "problem" : focus === "proton" ? "agent" : "neutral"]), l.bottomRight.x + 100, l.bottomRight.y + 120, { color: roleColors.muted, font: "800 13px Andale Mono, Courier New, monospace" });
      setMetric(charge, "charge", mass, "relative mass", places[focus] || "-", "location");
    }

    function drawElectronicConfig() {
      const l = splitLayout();
      const preset = String(getValue("atom_preset", "argon"));
      const presetCounts = { hydrogen: 1, sodium: 11, chlorine: 17, argon: 18, calcium: 20 };
      const electrons = Number(getValue("electron_count", presetCounts[preset] || 18));
      const mode = String(getValue("ion_charge_mode", "neutral"));
      const adjusted = mode === "cation" ? Math.max(1, electrons - 1) : mode === "anion" ? Math.min(20, electrons + 1) : electrons;
      const shells = shellFill(adjusted);
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Microscopic", "Electrons fill inner shells before outer shells.", roleColors.agent);
      electronShells(l.left.x + l.left.w * 0.5, l.left.y + l.left.h * 0.52, shells, { nucleusLabel: preset.slice(0, 2), nucleusRadius: 26 });
      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Macroscopic", "Stable patterns are counted shell by shell.", roleColors.resolution);
      const config = shells.join(",");
      drawText(config, l.topRight.x + 26, l.topRight.y + 100, { color: roleColors.resolution, font: "700 42px Georgia, serif" });
      drawText("configuration", l.topRight.x + 30, l.topRight.y + 132, { color: roleColors.muted, font: "800 12px Andale Mono, Courier New, monospace" });
      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Symbolic", "The commas are shell boundaries, not decoration.", roleColors.highlight);
      shells.forEach(function(count, index) {
        const x = l.bottomRight.x + 28 + index * 56;
        ctx.fillStyle = index === shells.length - 1 ? roleColors.highlight : roleColors.surfaceCool;
        ctx.fillRect(x, l.bottomRight.y + 78, 42, 48);
        ctx.strokeStyle = roleColors.neutral;
        ctx.strokeRect(x, l.bottomRight.y + 78, 42, 48);
        drawText(String(count), x + 21, l.bottomRight.y + 108, { align: "center", color: roleColors.neutral, font: "800 20px Andale Mono, Courier New, monospace" });
      });
      setMetric(String(adjusted), "electrons", config, "configuration", mode, "charge mode");
    }

    function drawNotationReader() {
      const l = splitLayout();
      const symbol = String(getValue("element_symbol", "Ca"));
      const z = Number(getValue("proton_number", 20));
      const a = Math.max(z, Number(getValue("nucleon_number", 40)));
      const charge = chargeNumber(getValue("charge_state", "atom"));
      const electrons = z - charge;
      const neutrons = a - z;
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Symbolic first", "Read A and Z before counting particles.", roleColors.highlight);
      const nx = l.left.x + l.left.w * 0.48;
      const ny = l.left.y + l.left.h * 0.52;
      drawText(String(a), nx - 52, ny - 56, { color: roleColors.problem, font: "800 38px Georgia, serif" });
      drawText(String(z), nx - 48, ny + 60, { color: roleColors.agent, font: "800 38px Georgia, serif" });
      drawText(symbol, nx, ny + 16, { color: roleColors.neutral, font: "700 96px Georgia, serif" });
      drawText(charge === 0 ? "neutral atom" : (charge > 0 ? charge + "+" : Math.abs(charge) + "-"), nx + 118, ny - 42, { color: roleColors.highlight, font: "800 20px Andale Mono, Courier New, monospace" });
      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Microscopic", "Nucleus identity follows proton number.", roleColors.agent);
      drawParticleCluster(l.topRight.x + l.topRight.w * 0.5, l.topRight.y + l.topRight.h * 0.56, z, neutrons, 7);
      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Particle counts", "n = nucleon number - proton number", roleColors.resolution);
      drawText("protons = " + z, l.bottomRight.x + 24, l.bottomRight.y + 82, { color: roleColors.agent, font: "800 16px Andale Mono, Courier New, monospace" });
      drawText("neutrons = " + a + " - " + z + " = " + neutrons, l.bottomRight.x + 24, l.bottomRight.y + 112, { color: roleColors.problem, font: "800 16px Andale Mono, Courier New, monospace" });
      drawText("electrons = " + electrons, l.bottomRight.x + 24, l.bottomRight.y + 142, { color: roleColors.resolution, font: "800 16px Andale Mono, Courier New, monospace" });
      setMetric(String(z), "proton number", String(neutrons), "neutrons", String(electrons), "electrons");
    }

    function drawIonTransfer(type) {
      const l = splitLayout();
      const isCation = type === "cation";
      const gained = Number(getValue(isCation ? "electron_loss_count" : "electron_gain_count", 0));
      const transfer = clamp(gained, 0, 1);
      const baseElectrons = isCation ? 11 : 17;
      const afterElectrons = isCation ? baseElectrons - transfer : baseElectrons + transfer;
      const symbol = isCation ? "Na" : "Cl";
      const charge = isCation ? "+" + transfer : "-" + transfer;
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Microscopic", isCation ? "Sodium loses its outer electron." : "Chlorine gains one outer electron.", roleColors.agent);
      const leftCx = l.left.x + l.left.w * 0.32;
      const rightCx = l.left.x + l.left.w * 0.68;
      const cy = l.left.y + l.left.h * 0.52;
      electronShells(leftCx, cy, shellFill(baseElectrons), { nucleusLabel: symbol, nucleusRadius: 24 });
      electronShells(rightCx, cy, shellFill(afterElectrons), { nucleusLabel: symbol, nucleusRadius: 24, electronColor: transfer ? roleColors.highlight : roleColors.agent });
      const t = (Math.sin(timeSeed * 2.2) + 1) / 2;
      const ex = isCation ? leftCx + 95 + t * 120 : rightCx + 120 - t * 150;
      const ey = cy - 92 + Math.sin(timeSeed * 5) * 8;
      ctx.fillStyle = roleColors.highlight;
      ctx.beginPath();
      ctx.arc(ex, ey, 7, 0, Math.PI * 2);
      ctx.fill();
      arrow(leftCx + 110, cy - 70, rightCx - 110, cy - 70, roleColors.highlight, 3);
      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Charge balance", "Protons stay fixed; electrons change.", roleColors.resolution);
      const protons = isCation ? 11 : 17;
      drawText(protons + " protons", l.topRight.x + 28, l.topRight.y + 86, { color: roleColors.problem, font: "800 17px Andale Mono, Courier New, monospace" });
      drawText(afterElectrons + " electrons", l.topRight.x + 28, l.topRight.y + 118, { color: roleColors.agent, font: "800 17px Andale Mono, Courier New, monospace" });
      drawText("net charge " + (transfer ? charge.replace("1", "") : "0"), l.topRight.x + 28, l.topRight.y + 150, { color: roleColors.highlight, font: "800 17px Andale Mono, Courier New, monospace" });
      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Symbolic", "The sign tells electron imbalance.", roleColors.highlight);
      drawText(symbol + (transfer ? (isCation ? "+" : "-") : ""), l.bottomRight.x + 30, l.bottomRight.y + 112, { color: roleColors.neutral, font: "700 62px Georgia, serif" });
      drawText(isCation ? "loss of e- makes + ion" : "gain of e- makes - ion", l.bottomRight.x + 30, l.bottomRight.y + 148, { color: roleColors.muted, font: "800 12px Andale Mono, Courier New, monospace" });
      setMetric(String(afterElectrons), "electrons", transfer ? (isCation ? "cation" : "anion") : "atom", "particle type", transfer ? (isCation ? "+" : "-") : "0", "charge");
    }

    function drawIsotopes() {
      const l = splitLayout();
      const element = String(getValue("base_element", "chlorine"));
      const base = element === "carbon" ? { symbol: "C", z: 6, a: 12 } : element === "magnesium" ? { symbol: "Mg", z: 12, a: 24 } : { symbol: "Cl", z: 17, a: 35 };
      const diff = Number(getValue("neutron_difference", 2));
      const property = String(getValue("compare_property", "chemical"));
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Microscopic comparison", "Same protons and electrons; different neutrons.", roleColors.agent);
      const y = l.left.y + l.left.h * 0.53;
      const a1 = base.a;
      const a2 = base.a + diff;
      drawParticleCluster(l.left.x + l.left.w * 0.32, y, base.z, a1 - base.z, 8);

    function drawMovingParticles(x, y, w, h, count, speed, success) {
      const box = { x: x + 22, y: y + 56, w: w - 44, h: h - 86 };

        const a = i * 2.399 + timeSeed * speed;

        const px = box.x + box.w * (0.5 + Math.cos(a) * r);

        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fill();

    }

      const gw = l.left.w - 136;
      const peak = catalyst ? 0.38 : 0.78;
      ctx.strokeStyle = roleColors.problem;

      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.bezierCurveTo(gx + gw * 0.25, gy - 120, gx + gw * 0.45, gy - l.left.h * peak, gx + gw * 0.55, gy - l.left.h * peak);
      ctx.bezierCurveTo(gx + gw * 0.7, gy - 80, gx + gw * 0.78, gy - 60, gx + gw, gy - 60);
      ctx.stroke();
      if (catalyst) {
        ctx.strokeStyle = roleColors.good;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.bezierCurveTo(gx + gw * 0.28, gy - 70, gx + gw * 0.42, gy - 150, gx + gw * 0.56, gy - 140);
        ctx.bezierCurveTo(gx + gw * 0.72, gy - 90, gx + gw * 0.82, gy - 60, gx + gw, gy - 60);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Microscopic", "More collisions have enough energy; catalyst is not used up.", roleColors.agent);
      drawMovingParticles(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, 42, rate, catalyst ? 0.9 : 0.4);
      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Macroscopic graph", "Faster rate, same final yield.", roleColors.resolution);
      drawGraph(l.bottomRight.x, l.bottomRight.y + 28, l.bottomRight.w, l.bottomRight.h - 24, rate, { tangentLabel: "faster" });
      setMetric(catalyst ? "present" : "absent", "catalyst", rate.toFixed(1) + "x", "rate", Boolean(getValue("show_yield", true)) ? "same yield" : "yield hidden", "final amount");
    }

    function drawGeneric() {
      const l = splitLayout();
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Mechanism", spec.mechanism, roleColors.agent);
      drawMovingParticles(l.left.x, l.left.y, l.left.w, l.left.h, 42, 1.2, 0.55);
      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Linked outcome", spec.transferable_principle, roleColors.resolution);
      drawGraph(l.topRight.x, l.topRight.y + 28, l.topRight.w, l.topRight.h - 24, 1.2, { tangentLabel: "linked change" });
      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Symbolic", spec.steps.map(function(step) { return step.name; }).join(" -> "), roleColors.highlight);
      drawText(spec.topic, l.bottomRight.x + 24, l.bottomRight.y + 110, { color: roleColors.highlight, font: "800 26px Georgia, serif" });
      setMetric("linked", "views", String(spec.controls.length), "controls", String(spec.scenarios.length), "scenarios");
    }

    function drawDomainScene() {
      const id = spec.id;
      if (id.indexOf("subatomic-particle-map") >= 0) return drawSubatomic();
      if (id.indexOf("electronic-configuration") >= 0) return drawElectronicConfig();
      if (id.indexOf("proton-nucleon") >= 0) return drawNotationReader();
      if (id.indexOf("sodium-cation") >= 0) return drawIonTransfer("cation");
      if (id.indexOf("chloride-anion") >= 0) return drawIonTransfer("anion");
      if (id.indexOf("isotope-properties") >= 0) return drawIsotopes();
      if (id.indexOf("relative-atomic-mass") >= 0) return drawRelativeMass();
      if (id.indexOf("og-element") >= 0) return drawOganesson();
      if (id.indexOf("two-minus-ion") >= 0) return drawTwoMinusIon();
      if (id.indexOf("measurement-gradient") >= 0) return drawRateMeasurement();
      if (id.indexOf("effective-collision") >= 0) return drawCollisionGate();
      if (id.indexOf("particle-size") >= 0) return drawSurfaceArea();
      if (id.indexOf("concentration") >= 0) return drawConcentration();
      if (id.indexOf("pressure") >= 0) return drawPressure();
      if (id.indexOf("temperature") >= 0) return drawTemperature();
      if (id.indexOf("catalyst") >= 0) return drawCatalyst();
      return drawGeneric();
    }

    function draw(time) {
      animationId = null;
      const delta = Math.min(0.04, Math.max(0.001, (time - lastTime) / 1000 || 0.016));
      lastTime = time;
      if (motion) timeSeed += delta;
      clearCanvas();
      drawDomainScene();
      if (!document.hidden) scheduleDraw();
    }

    function scheduleDraw() {
      if (animationId === null) animationId = requestAnimationFrame(draw);
    }

    window.addEventListener("resize", function() {
      resizeCanvas();
      scheduleDraw();
    });

    document.addEventListener("visibilitychange", function() {
      if (document.hidden && animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
      } else {
        lastTime = performance.now();
        scheduleDraw();
      }
    });

    resetValues();
    renderStatic();
    renderAll();
    resizeCanvas();
    scheduleDraw();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proton and Nucleon Number Reader</title>
  <style>
    :root {
      --problem: #c84a36;
      --agent: #087a8a;
      --resolution: #247c6f;
      --neutral: #151913;
      --highlight: #d79d1f;
      --good: #207857;
      --paper: #fbf6ec;
      --paper-strong: #ffffff;
      --rule: #d8cdb0;
      --rule-soft: rgba(21, 25, 19, 0.08);
      --muted: #6a7166;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--paper);
      color: var(--neutral);
      font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }

    button,
    input,
    select {
      color: inherit;
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid rgba(8, 122, 138, 0.45);
      outline-offset: 2px;
    }

    .artifact {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 300px);
      grid-template-rows: auto minmax(0, 1fr);
      column-gap: 28px;
      row-gap: 14px;
      width: 100%;
      height: 100vh;
      min-height: 520px;
      padding: 22px 28px 18px;
      animation: settle 380ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .head {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: baseline;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--rule);
    }

    .eyebrow,
    .source,
    .scenario-count,
    .control-label,
    .metric,
    .metric-label,
    .scenario-tab,
    .vocab-chip,
    .checkpoint-label,
    .prediction button,
    .toggle-button,
    .choice-row button {
      font-family: "Andale Mono", "Courier New", monospace;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--agent);
      font-size: 10px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(22px, 2.4vw, 30px);
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .aha {
      max-width: 720px;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .source {
      align-self: end;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .canvas-wrap {
      position: relative;
      min-height: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      padding-top: 10px;
      border-top: 1px solid var(--rule-soft);
    }

    .metric {
      min-width: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-bottom: 2px;
      color: var(--neutral);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      text-transform: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .side {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    .scenario-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .scenario-tab {
      flex: 0 0 auto;
      padding: 2px 0 4px;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 9px;
      font-weight: 800;
      border-bottom: 2px solid transparent;
      text-align: left;
    }

    .scenario-tab[aria-current="true"] {
      color: var(--neutral);
      border-bottom-color: var(--agent);
    }

    .question {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .scenario-count {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .question h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.1;
    }

    .question p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .prediction {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .prediction button,
    .toggle-button,
    .choice-row button {
      min-height: 28px;
      padding: 5px 8px;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--neutral);
      cursor: pointer;
      font-size: 9px;
      font-weight: 800;
    }

    .prediction button[aria-pressed="true"],
    .toggle-button[aria-pressed="true"],
    .choice-row button[aria-current="true"] {
      background: var(--neutral);
      border-color: var(--neutral);
      color: var(--paper);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control[aria-disabled="true"] {
      opacity: 0.45;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .control-label span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .control-label span:last-child {
      color: var(--neutral);
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: var(--agent);
    }

    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .choice-row button {
      flex: 0 1 auto;
      min-height: 26px;
      padding: 4px 8px;
    }

    .checkpoint {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--rule-soft);
    }

    .checkpoint-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
    }

    .checkpoint strong.prompt-text {
      color: var(--neutral);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: 13px;
      line-height: 1.35;
      text-transform: none;
      letter-spacing: 0;
    }

    .checkpoint p,
    .feedback {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .vocab {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      padding-top: 8px;
      border-top: 1px solid var(--rule-soft);
    }

    .vocab-chip {
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 880px) {
      .artifact {
        grid-template-columns: minmax(0, 1fr);
        padding: 16px 18px;
      }

      .head {
        grid-template-columns: minmax(0, 1fr);
      }

      .source {
        text-align: left;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="artifact">
    <header class="head">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p class="aha" id="aha"></p>
      </div>
      <div class="source" id="source"></div>
    </header>

    <section class="stage" aria-label="Interactive teaching artifact">
      <div class="canvas-wrap">
        <canvas id="scene" aria-label="Proton and Nucleon Number Reader interactive visual"></canvas>
      </div>
      <div class="metrics">
        <div class="metric"><strong id="metric-one">-</strong><span class="metric-label" id="metric-one-label">micro view</span></div>
        <div class="metric"><strong id="metric-two">-</strong><span class="metric-label" id="metric-two-label">macro view</span></div>
        <div class="metric"><strong id="metric-three">-</strong><span class="metric-label" id="metric-three-label">symbolic view</span></div>
      </div>
    </section>

    <aside class="side">
      <nav class="scenario-tabs" id="scenario-tabs" aria-label="Scenarios"></nav>

      <section class="question">
        <p class="scenario-count" id="scenario-count"></p>
        <h2 id="scenario-title"></h2>
        <p id="scenario-question"></p>
      </section>

      <div class="prediction" id="prediction"></div>

      <div class="controls" id="controls"></div>

      <section class="checkpoint" id="checkpoint"></section>

      <div class="vocab" id="vocab"></div>
    </aside>
  </main>

  <script>
    const spec = {"id":"atomic-structure-proton-nucleon-notation-reader","source_ref":"page 5","subject":"O Level Chemistry","topic":"Proton and nucleon number","medium":"interactive_html","mechanism":"In nuclide notation, the lower number is proton number and the upper number is nucleon number, so neutrons are found by subtraction.","transferable_principle":"Element identity follows proton number, while nucleon number counts protons plus neutrons.","steps":[{"name":"Read the lower number","beat":"Point to the proton number below the symbol and assign that many protons."},{"name":"Read the upper number","beat":"Point to the nucleon number above the symbol as protons plus neutrons."},{"name":"Subtract for neutrons","beat":"Subtract proton number from nucleon number to reveal neutron count."},{"name":"Use neutrality","beat":"If it is an atom with no charge, set electrons equal to protons."},{"name":"Name the element","beat":"Show that proton number, not nucleon number, fixes the element identity."}],"key_symbols":[{"symbol":"Ca","role":"neutral","meaning":"Element symbol used in the notes for calcium notation."},{"symbol":"20","role":"agent","meaning":"Proton number: total protons in the atom."},{"symbol":"40","role":"highlight","meaning":"Nucleon number: total protons plus neutrons."},{"symbol":"40 - 20","role":"resolution","meaning":"Subtraction used to find neutrons."},{"symbol":"neutral atom","role":"problem","meaning":"The condition that makes electrons equal to protons."}],"interactivity_hooks":["Drag labels onto upper number, lower number, and element symbol.","Change proton and nucleon numbers to see whether element identity or neutron count changes.","Toggle atom versus ion to decide when electrons equal protons."],"output_filename":"atomic-structure-proton-nucleon-notation-reader.html","artifact_metadata":{"title":"Proton and Nucleon Number Reader","subject":"O Level Chemistry","level":"O Level Chemistry","syllabus_reference":"MOE 6092 Chemistry: Atomic Structure","estimated_interaction_time_minutes":7,"prerequisite_concepts":["Protons and neutrons are in the nucleus","Neutral atoms have equal protons and electrons"]},"learning_design":{"core_aha":"I can decode the whole atom by reading lower number, upper number, then subtracting.","learning_objectives":["Students translate nuclide notation into protons, neutrons, electrons, and element identity.","Given nuclide notation, students find protons, neutrons, and electrons without swapping proton and nucleon number.","Element identity follows proton number, while nucleon number counts protons plus neutrons."],"target_misconceptions":[{"misconception":"The upper number is proton number because it is printed on top.","correction":"The upper number is nucleon number; the lower number is proton number.","addressed_in_scenario_id":"change_neutrons_not_identity"},{"misconception":"Nucleon number means neutrons only.","correction":"The upper number is nucleon number; the lower number is proton number.","addressed_in_scenario_id":"change_neutrons_not_identity"},{"misconception":"Element identity changes when neutron count changes.","correction":"The upper number is nucleon number; the lower number is proton number.","addressed_in_scenario_id":"change_neutrons_not_identity"},{"misconception":"Electrons always equal protons even when a charge is shown.","correction":"The upper number is nucleon number; the lower number is proton number.","addressed_in_scenario_id":"change_neutrons_not_identity"}]},"representations":{"description":"All views are linked: changing a control updates the particle/subatomic view, the observable outcome, and the symbolic notation or table.","views":[{"id":"microscopic_nucleus_view","type":"microscopic","description":"Protons and neutrons inside the nucleus with electrons in shells for neutral atoms."},{"id":"symbolic_nuclide_notation","type":"symbolic","description":"Upper nucleon number, lower proton number, and element symbol."},{"id":"subtraction_equation","type":"symbolic","description":"neutrons = nucleon number - proton number."},{"id":"particle_count_table","type":"macroscopic","description":"Protons, neutrons, electrons, and overall charge."}]},"controls":[{"id":"element_symbol","label":"Element symbol","type":"discrete","default":"Ca","options":["Ca","Cl","Na","Og"],"affects":["symbolic_nuclide_notation","microscopic_nucleus_view"]},{"id":"proton_number","label":"Proton number","type":"slider","min":1,"max":118,"default":20,"step":1,"affects":["symbolic_nuclide_notation","particle_count_table","microscopic_nucleus_view"]},{"id":"nucleon_number","label":"Nucleon number","type":"slider","min":1,"max":294,"default":40,"step":1,"affects":["symbolic_nuclide_notation","subtraction_equation","particle_count_table"]},{"id":"charge_state","label":"Particle charge","type":"discrete","default":"atom","options":["atom","1+","1-","2-"],"affects":["particle_count_table","microscopic_nucleus_view"]}],"scenarios":[{"id":"decode_calcium","title":"Decode calcium","guiding_question":"For calcium-40 with proton number 20, how many protons, neutrons, and electrons are there?","locked_controls":["element_symbol","proton_number","nucleon_number","charge_state"],"active_controls":[],"success_criterion":"Student states 20 protons, 20 neutrons, and 20 electrons for a neutral calcium atom."},{"id":"change_neutrons_not_identity","title":"Identity check","guiding_question":"If only the nucleon number changes, did the element change?","locked_controls":["element_symbol","proton_number","charge_state"],"active_controls":["nucleon_number"],"success_criterion":"Student explains that changing nucleon number changes neutron count, not the element identity.","misconception_buster":true},{"id":"atom_vs_ion_electrons","title":"Atom or ion?","guiding_question":"When should electrons equal the proton number?","locked_controls":["element_symbol","proton_number","nucleon_number"],"active_controls":["charge_state"],"success_criterion":"Student says electrons equal protons only for a neutral atom, then adjust for charge in ions.","misconception_buster":true},{"id":"free_notation_reader","title":"Free decode","guiding_question":"Can you predict the particle counts before revealing the table?","locked_controls":[],"active_controls":["element_symbol","proton_number","nucleon_number","charge_state"],"success_criterion":"Student decodes notation into correct protons, neutrons, electrons, and charge."}],"checkpoints":[{"id":"checkpoint_upper_lower","after_scenario":"decode_calcium","prompt":"A student says the upper number is the proton number. How do you correct them?","type":"fill_in_blank","answers":["The upper number is nucleon number"]},{"id":"checkpoint_identity_rule","after_scenario":"change_neutrons_not_identity","prompt":"What determines the identity of an element?","type":"fill_in_blank","answers":["The proton number determines the identity of an element"]}],"ui_requirements":{"always_visible":["reset_button","current_scenario_title","rate_readout"],"syllabus_vocabulary_to_surface":["proton number","nucleon number","isotopes","relative atomic mass","ions","electronic configuration","charge","shells","electrons"],"tone":"Clear, direct, no childish language. Treat students as capable.","accessibility":["colourblind-safe palette","labels not just colours","keyboard-navigable controls","Use explicit labels for upper number, lower number, and charge state."]}};
    const roleLabels = {"problem":"Trap","agent":"Cause","resolution":"Outcome","neutral":"Structure","highlight":"Focus"};
    const roleColors = {
      problem: "#c84a36",
      agent: "#087a8a",
      resolution: "#247c6f",
      neutral: "#151913",
      highlight: "#d79d1f",
      good: "#207857",
      paper: "#fbf6ec",
      paperStrong: "#ffffff",
      rule: "#d8cdb0",
      muted: "#6a7166"
    };

    const predictionChoices = ["Increase", "Decrease", "Stay same", "It depends"];
    const values = {};
    const checkpointState = {};
    let scenarioIndex = 0;
    let predictionMade = false;
    let selectedPrediction = "";
    let motion = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let animationId = null;
    let lastTime = 0;
    let timeSeed = 0;

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const scenarioTabs = document.getElementById("scenario-tabs");
    const controlsEl = document.getElementById("controls");
    const predictionEl = document.getElementById("prediction");
    const checkpointEl = document.getElementById("checkpoint");

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function compact(value, max) {
      const text = String(value || "");
      return text.length > max ? text.slice(0, max - 3).trim() + "..." : text;
    }

    function currentScenario() {
      return spec.scenarios[scenarioIndex] || spec.scenarios[0];
    }

    function controlById(id) {
      return spec.controls.find(function(control) { return control.id === id; });
    }

    function defaultValue(control) {
      if (control.default !== undefined) return control.default;
      if (control.type === "toggle") return false;
      if (control.type === "slider" || control.type === "stepper") return control.min || 0;
      return control.options && control.options.length ? control.options[0] : "";
    }

    function resetValues() {
      spec.controls.forEach(function(control) {
        values[control.id] = defaultValue(control);
      });
    }

    function getValue(id, fallback) {
      return values[id] === undefined ? fallback : values[id];
    }

    function setMetric(one, oneLabel, two, twoLabel, three, threeLabel) {
      document.getElementById("metric-one").textContent = one;
      document.getElementById("metric-one-label").textContent = oneLabel;
      document.getElementById("metric-two").textContent = two;
      document.getElementById("metric-two-label").textContent = twoLabel;
      document.getElementById("metric-three").textContent = three;
      document.getElementById("metric-three-label").textContent = threeLabel;
    }

    function activeControlIds() {
      const scenario = currentScenario();
      if (!scenario || !scenario.active_controls.length) return new Set();
      return new Set(scenario.active_controls);
    }

    function isLocked(control) {
      const scenario = currentScenario();
      if (!scenario) return true;
      return !predictionMade ||
        scenario.locked_controls.indexOf(control.id) >= 0 ||
        !activeControlIds().has(control.id);
    }

    function controlNorm(id, fallback) {
      const control = controlById(id);
      if (!control) return fallback || 0;
      const value = getValue(id, control.default);
      if (control.type === "toggle") return value ? 1 : 0;
      if (control.type === "slider" || control.type === "stepper") {
        return clamp((Number(value) - Number(control.min || 0)) / Math.max(1, Number(control.max || 100) - Number(control.min || 0)), 0, 1);
      }
      const options = control.options || [];
      const index = Math.max(0, options.indexOf(String(value)));
      return options.length <= 1 ? 0 : index / (options.length - 1);
    }

    function applyControlSideEffects(id) {
      const presetAtoms = {
        hydrogen: 1,
        sodium: 11,
        chlorine: 17,
        argon: 18,
        calcium: 20
      };
      const elementData = {
        Ca: { z: 20, a: 40 },
        Cl: { z: 17, a: 35 },
        Na: { z: 11, a: 23 },
        Og: { z: 118, a: 294 }
      };

      if (id === "atom_preset" && presetAtoms[String(values.atom_preset)]) {
        values.electron_count = presetAtoms[String(values.atom_preset)];
      }

      if (id === "element_symbol" && elementData[String(values.element_symbol)]) {
        values.proton_number = elementData[String(values.element_symbol)].z;
        values.nucleon_number = elementData[String(values.element_symbol)].a;
      }
    }

    function shellFill(electrons) {
      let remaining = Math.max(0, Math.round(electrons));
      const caps = [2, 8, 8, 18];
      return caps.map(function(cap) {
        const used = Math.min(cap, remaining);
        remaining -= used;
        return used;
      }).filter(function(count, index) {
        return count > 0 || index < 2;
      });
    }

    function chargeNumber(label) {
      const value = String(label || "atom");
      if (value === "atom" || value === "neutral") return 0;
      if (value.indexOf("+") >= 0) return Number(value.replace("+", "")) || 1;
      if (value.indexOf("-") >= 0) return -1 * (Number(value.replace("-", "")) || 1);
      return 0;
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function renderStatic() {
      document.getElementById("eyebrow").textContent = spec.artifact_metadata.level + " · " + spec.subject;
      document.getElementById("source").textContent = spec.source_ref;
      document.getElementById("title").textContent = spec.artifact_metadata.title || spec.topic;
      document.getElementById("aha").textContent = spec.learning_design.core_aha;

      const vocab = document.getElementById("vocab");
      vocab.replaceChildren();
      spec.ui_requirements.syllabus_vocabulary_to_surface.slice(0, 8).forEach(function(term) {
        const chip = document.createElement("span");
        chip.className = "vocab-chip";
        chip.textContent = term;
        vocab.append(chip);
      });
    }

    function renderScenarios() {
      scenarioTabs.replaceChildren();
      spec.scenarios.slice(0, 4).forEach(function(scenario, index) {
        const button = document.createElement("button");
        button.className = "scenario-tab";
        button.type = "button";
        button.textContent = String(index + 1).padStart(2, "0") + " " + scenario.title;
        button.setAttribute("aria-current", index === scenarioIndex ? "true" : "false");
        button.addEventListener("click", function() {
          scenarioIndex = index;
          predictionMade = false;
          selectedPrediction = "";
          renderAll();
        });
        scenarioTabs.append(button);
      });
    }

    function renderQuestion() {
      const scenario = currentScenario();
      document.getElementById("scenario-count").textContent = "Scenario " + (scenarioIndex + 1) + " of " + spec.scenarios.length;
      document.getElementById("scenario-title").textContent = scenario.title;
      document.getElementById("scenario-question").textContent = predictionMade
        ? (scenario.success_criterion || "Use the controls and link the three views.")
        : scenario.guiding_question;

      predictionEl.replaceChildren();
      if (!predictionMade) {
        predictionChoices.forEach(function(choice) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = choice;
          button.addEventListener("click", function() {
            predictionMade = true;
            selectedPrediction = choice;
            renderAll();
          });
          predictionEl.append(button);
        });
      } else {
        const left = document.createElement("button");
        left.type = "button";
        left.textContent = "Predicted: " + selectedPrediction;
        left.setAttribute("aria-pressed", "true");
        const reset = document.createElement("button");
        reset.type = "button";
        reset.textContent = "Reset";
        reset.addEventListener("click", function() {
          resetValues();
          predictionMade = false;
          selectedPrediction = "";
          renderAll();
        });
        predictionEl.append(left, reset);
      }
    }

    function renderControls() {
      controlsEl.replaceChildren();
      spec.controls.slice(0, 5).forEach(function(control) {
        const locked = isLocked(control);
        const item = document.createElement("div");
        item.className = "control";
        item.setAttribute("aria-disabled", locked ? "true" : "false");

        const label = document.createElement("div");
        label.className = "control-label";
        const name = document.createElement("span");
        name.textContent = control.label;
        const value = document.createElement("span");
        value.textContent = String(formatControlValue(control));
        label.append(name, value);
        item.append(label);

        if (control.type === "slider" || control.type === "stepper") {
          const input = document.createElement("input");
          input.type = "range";
          input.min = String(control.min || 0);
          input.max = String(control.max || 100);
          input.step = String(control.step || 1);
          input.value = String(values[control.id]);
          input.disabled = locked;
          input.addEventListener("input", function(event) {
            values[control.id] = Number(event.target.value);
            renderControls();
          });
          item.append(input);
        } else if (control.type === "toggle") {
          const button = document.createElement("button");
          button.className = "toggle-button";
          button.type = "button";
          button.disabled = locked;
          button.textContent = values[control.id] ? "On" : "Off";
          button.setAttribute("aria-pressed", values[control.id] ? "true" : "false");
          button.addEventListener("click", function() {
            values[control.id] = !values[control.id];
            renderControls();
          });
          item.append(button);
        } else {
          const group = document.createElement("div");
          group.className = "choice-row";
          (control.options || []).slice(0, 5).forEach(function(option) {
            const button = document.createElement("button");
            button.type = "button";
            button.disabled = locked;
            button.textContent = option;
            button.setAttribute("aria-current", String(values[control.id]) === option ? "true" : "false");
            button.addEventListener("click", function() {
              values[control.id] = option;
              applyControlSideEffects(control.id);
              renderControls();
            });
            group.append(button);
          });
          item.append(group);
        }

        controlsEl.append(item);
      });
    }

    function formatControlValue(control) {
      const value = values[control.id];
      if (control.type === "toggle") return value ? "On" : "Off";
      return value;
    }

    function renderCheckpoint() {
      checkpointEl.replaceChildren();
      const scenario = currentScenario();
      const checkpoint = spec.checkpoints.find(function(item) {
        return item.after_scenario === scenario.id;
      }) || spec.checkpoints[0];

      if (!checkpoint) return;

      const kicker = document.createElement("p");
      kicker.className = "checkpoint-label";
      kicker.textContent = "Checkpoint";
      checkpointEl.append(kicker);

      const prompt = document.createElement("strong");
      prompt.className = "prompt-text";
      prompt.textContent = checkpoint.prompt;
      checkpointEl.append(prompt);

      if (checkpoint.type === "multiple_choice") {
        const group = document.createElement("div");
        group.className = "choice-row";
        checkpoint.options.forEach(function(option) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = option;
          button.setAttribute("aria-pressed", checkpointState[checkpoint.id] === option ? "true" : "false");
          button.addEventListener("click", function() {
            checkpointState[checkpoint.id] = option;
            renderCheckpoint();
          });
          group.append(button);
        });
        checkpointEl.append(group);
      } else if (checkpoint.type === "matching") {
        checkpoint.pairs.slice(0, 3).forEach(function(pair) {
          const p = document.createElement("p");
          p.textContent = pair.factor + " → " + pair.mechanism;
          checkpointEl.append(p);
        });
      } else {
        const p = document.createElement("p");
        p.textContent = "Say it aloud, then check the visual: " + checkpoint.answers.join(" / ");
        checkpointEl.append(p);
      }

      const feedback = document.createElement("p");
      feedback.className = "feedback";
      if (checkpoint.type === "multiple_choice" && checkpointState[checkpoint.id]) {
        feedback.textContent = checkpointState[checkpoint.id] === checkpoint.answer
          ? "Good. The explanation matches the mechanism."
          : "Not quite. Look for the view that changed first.";
        feedback.style.color = checkpointState[checkpoint.id] === checkpoint.answer ? roleColors.good : roleColors.problem;
      } else if (predictionMade) {
        feedback.textContent = currentScenario().prompt_after || "Connect the particle change to the symbol.";
      } else {
        feedback.textContent = "Predict first; the checkpoint makes the mechanism explicit.";
      }
      checkpointEl.append(feedback);
    }

    function renderAll() {
      renderScenarios();
      renderQuestion();
      renderControls();
      renderCheckpoint();
    }

    function clearCanvas() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);
    }

    function panel(x, y, w, h, title, subtitle, accent) {
      ctx.save();
      ctx.fillStyle = accent || roleColors.agent;
      ctx.fillRect(x, y + 4, 3, 14);
      drawText(title, x + 12, y + 16, {
        color: roleColors.muted,
        font: "800 10px Andale Mono, Courier New, monospace"
      });
      if (subtitle) {
        drawText(compact(subtitle, 64), x + 12, y + 32, {
          color: roleColors.muted,
          font: "11px Georgia, Times New Roman, serif",
          maxWidth: w - 24
        });
      }
      ctx.restore();
    }

    function drawText(text, x, y, options) {
      const opts = options || {};
      ctx.save();
      ctx.fillStyle = opts.color || roleColors.neutral;
      ctx.font = opts.font || "800 12px Andale Mono, Courier New, monospace";
      ctx.textAlign = opts.align || "left";
      ctx.textBaseline = opts.baseline || "alphabetic";
      const maxWidth = opts.maxWidth || 9999;
      const lineHeight = opts.lineHeight || 15;
      const words = String(text || "").split(" ");
      let line = "";
      let yy = y;
      for (let i = 0; i < words.length; i += 1) {
        const test = line ? line + " " + words[i] : words[i];
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, yy);
          line = words[i];
          yy += lineHeight;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, x, yy);
      ctx.restore();
    }

    function arrow(x1, y1, x2, y2, color, width) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.save();
      ctx.strokeStyle = color || roleColors.highlight;
      ctx.fillStyle = color || roleColors.highlight;
      ctx.lineWidth = width || 2;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.translate(x2, y2);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-9, -5);
      ctx.lineTo(-9, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function electronShells(cx, cy, shells, options) {
      const opts = options || {};
      const maxShells = Math.max(1, shells.length);
      ctx.save();
      for (let shell = 0; shell < maxShells; shell += 1) {
        const radius = opts.radiusBase || 32;
        const r = radius + shell * (opts.shellGap || 30);
        ctx.strokeStyle = roleColors.rule;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        const count = shells[shell] || 0;
        for (let i = 0; i < count; i += 1) {
          const angle = (i / Math.max(count, 1)) * Math.PI * 2 + timeSeed * (0.22 + shell * 0.05);
          const ex = cx + Math.cos(angle) * r;
          const ey = cy + Math.sin(angle) * r;
          ctx.fillStyle = opts.electronColor || roleColors.agent;
          ctx.beginPath();
          ctx.arc(ex, ey, opts.electronRadius || 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.fillStyle = opts.nucleusColor || roleColors.problem;
      ctx.beginPath();
      ctx.arc(cx, cy, opts.nucleusRadius || 22, 0, Math.PI * 2);
      ctx.fill();
      drawText(opts.nucleusLabel || "nucleus", cx, cy + 4, {
        align: "center",
        color: roleColors.paper,
        font: "800 10px Andale Mono, Courier New, monospace"
      });
      ctx.restore();
    }

    function drawParticleCluster(cx, cy, protons, neutrons, scale) {
      const total = Math.min(36, Math.max(6, protons + neutrons));
      const shownProtons = Math.round(total * protons / Math.max(1, protons + neutrons));
      for (let i = 0; i < total; i += 1) {
        const ring = Math.floor(Math.sqrt(i));
        const angle = i * 2.399 + timeSeed * 0.08;
        const r = ring * (scale || 7);
        ctx.fillStyle = i < shownProtons ? roleColors.problem : roleColors.neutral;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r, (scale || 7) * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function splitLayout() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const gap = 24;
      const leftW = Math.max(320, width * 0.56);
      const rightX = leftW + gap;
      const rightW = Math.max(180, width - rightX);
      const halfH = (height - gap) * 0.5;
      return {
        width: width,
        height: height,
        left: { x: 0, y: 0, w: leftW, h: height },
        topRight: { x: rightX, y: 0, w: rightW, h: halfH },
        bottomRight: { x: rightX, y: halfH + gap, w: rightW, h: halfH }
      };
    }

    function drawGraph(x, y, w, h, rate, options) {
      const opts = options || {};
      const gx = x + 42;
      const gy = y + h - 36;
      const gw = w - 66;
      const gh = h - 84;
      ctx.strokeStyle = roleColors.neutral;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(gx, gy - gh);
      ctx.lineTo(gx, gy);
      ctx.lineTo(gx + gw, gy);
      ctx.stroke();
      ctx.strokeStyle = opts.color || roleColors.resolution;
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i <= 80; i += 1) {
        const t = i / 80;
        const value = opts.decreasing ? Math.exp(-rate * t * 1.3) : 1 - Math.exp(-rate * t * 1.3);
        const px = gx + t * gw;
        const py = opts.decreasing ? gy - value * gh * 0.86 : gy - value * gh * 0.86;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      if (opts.tangent !== false) {
        const tx = gx + gw * 0.2;
        const ty = opts.decreasing
          ? gy - Math.exp(-rate * 0.2 * 1.3) * gh * 0.86
          : gy - (1 - Math.exp(-rate * 0.2 * 1.3)) * gh * 0.86;
        arrow(tx - 26, ty + 24, tx + 34, ty - 24, roleColors.highlight, 2.5);
        drawText(opts.tangentLabel || "initial gradient", tx + 6, ty - 32, {
          color: roleColors.highlight,
          font: "800 11px Andale Mono, Courier New, monospace"
        });
      }
      drawText(opts.yLabel || "amount", gx - 22, gy - gh - 8, {
        color: roleColors.muted,
        font: "800 10px Andale Mono, Courier New, monospace"
      });
      drawText("time", gx + gw - 18, gy + 20, {
        color: roleColors.muted,
        font: "800 10px Andale Mono, Courier New, monospace"
      });
    }

    function drawElectronicConfig() {
      const l = splitLayout();
      const preset = String(getValue("atom_preset", "argon"));
      const presetCounts = { hydrogen: 1, sodium: 11, chlorine: 17, argon: 18, calcium: 20 };
      const electrons = Number(getValue("electron_count", presetCounts[preset] || 18));
      const mode = String(getValue("ion_charge_mode", "neutral"));
      const adjusted = mode === "cation" ? Math.max(1, electrons - 1) : mode === "anion" ? Math.min(20, electrons + 1) : electrons;
      const shells = shellFill(adjusted);
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Microscopic", "Electrons fill inner shells before outer shells.", roleColors.agent);
      electronShells(l.left.x + l.left.w * 0.5, l.left.y + l.left.h * 0.55, shells, { nucleusLabel: preset.slice(0, 2), nucleusRadius: 26 });
      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Macroscopic", "Stable patterns are counted shell by shell.", roleColors.resolution);
      const config = shells.join(",");
      drawText(config, l.topRight.x + 12, l.topRight.y + 90, { color: roleColors.resolution, font: "700 36px Georgia, serif" });
      drawText("configuration", l.topRight.x + 12, l.topRight.y + 116, { color: roleColors.muted, font: "800 11px Andale Mono, Courier New, monospace" });
      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Symbolic", "The commas are shell boundaries, not decoration.", roleColors.highlight);
      shells.forEach(function(count, index) {
        const x = l.bottomRight.x + 14 + index * 50;
        ctx.fillStyle = index === shells.length - 1 ? roleColors.highlight : "rgba(36, 124, 111, 0.18)";
        ctx.fillRect(x, l.bottomRight.y + 70, 38, 44);
        ctx.strokeStyle = roleColors.neutral;
        ctx.lineWidth = 1;
        ctx.strokeRect(x, l.bottomRight.y + 70, 38, 44);
        drawText(String(count), x + 19, l.bottomRight.y + 98, { align: "center", color: roleColors.neutral, font: "800 18px Andale Mono, Courier New, monospace" });
      });
      setMetric(String(adjusted), "electrons", config, "configuration", mode, "charge mode");
    }

    function drawIonTransfer(type) {
      const l = splitLayout();
      const isCation = type === "cation";
      const gained = Number(getValue(isCation ? "electron_loss_count" : "electron_gain_count", 0));
      const transfer = clamp(gained, 0, 1);
      const baseElectrons = isCation ? 11 : 17;
      const afterElectrons = isCation ? baseElectrons - transfer : baseElectrons + transfer;
      const symbol = isCation ? "Na" : "Cl";
      const charge = isCation ? "+" + transfer : "-" + transfer;
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Microscopic", isCation ? "Sodium loses its outer electron." : "Chlorine gains one outer electron.", roleColors.agent);
      const leftCx = l.left.x + l.left.w * 0.32;
      const rightCx = l.left.x + l.left.w * 0.68;
      const cy = l.left.y + l.left.h * 0.55;
      electronShells(leftCx, cy, shellFill(baseElectrons), { nucleusLabel: symbol, nucleusRadius: 24 });
      electronShells(rightCx, cy, shellFill(afterElectrons), { nucleusLabel: symbol, nucleusRadius: 24, electronColor: transfer ? roleColors.highlight : roleColors.agent });
      const t = (Math.sin(timeSeed * 2.2) + 1) / 2;
      const ex = isCation ? leftCx + 95 + t * 120 : rightCx + 120 - t * 150;
      const ey = cy - 92 + Math.sin(timeSeed * 5) * 8;
      ctx.fillStyle = roleColors.highlight;
      ctx.beginPath();
      ctx.arc(ex, ey, 7, 0, Math.PI * 2);
      ctx.fill();
      arrow(leftCx + 110, cy - 70, rightCx - 110, cy - 70, roleColors.highlight, 2.5);
      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Charge balance", "Protons stay fixed; electrons change.", roleColors.resolution);
      const protons = isCation ? 11 : 17;
      drawText(protons + " protons", l.topRight.x + 12, l.topRight.y + 76, { color: roleColors.problem, font: "800 15px Andale Mono, Courier New, monospace" });
      drawText(afterElectrons + " electrons", l.topRight.x + 12, l.topRight.y + 102, { color: roleColors.agent, font: "800 15px Andale Mono, Courier New, monospace" });
      drawText("net charge " + (transfer ? charge.replace("1", "") : "0"), l.topRight.x + 12, l.topRight.y + 128, { color: roleColors.highlight, font: "800 15px Andale Mono, Courier New, monospace" });
      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Symbolic", "The sign tells electron imbalance.", roleColors.highlight);
      drawText(symbol + (transfer ? (isCation ? "+" : "-") : ""), l.bottomRight.x + 14, l.bottomRight.y + 110, { color: roleColors.neutral, font: "700 54px Georgia, serif" });
      drawText(isCation ? "loss of e- makes + ion" : "gain of e- makes - ion", l.bottomRight.x + 14, l.bottomRight.y + 134, { color: roleColors.muted, font: "800 11px Andale Mono, Courier New, monospace" });
      setMetric(String(afterElectrons), "electrons", transfer ? (isCation ? "cation" : "anion") : "atom", "particle type", transfer ? (isCation ? "+" : "-") : "0", "charge");
    }

    function drawIsotopes() {
      const l = splitLayout();
      const element = String(getValue("base_element", "chlorine"));
      const base = element === "carbon" ? { symbol: "C", z: 6, a: 12 } : element === "magnesium" ? { symbol: "Mg", z: 12, a: 24 } : { symbol: "Cl", z: 17, a: 35 };
      const diff = Number(getValue("neutron_difference", 2));
      const property = String(getValue("compare_property", "chemical"));
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Microscopic comparison", "Same protons and electrons; different neutrons.", roleColors.agent);
      const y = l.left.y + l.left.h * 0.56;
      const a1 = base.a;
      const a2 = base.a + diff;
      drawParticleCluster(l.left.x + l.left.w * 0.32, y, base.z, a1 - base.z, 8);
      drawParticleCluster(l.left.x + l.left.w * 0.68, y, base.z, a2 - base.z, 8);
      drawText(base.symbol + "-" + a1, l.left.x + l.left.w * 0.32, y + 92, { align: "center", color: roleColors.neutral, font: "800 18px Georgia, serif" });
      drawText(base.symbol + "-" + a2, l.left.x + l.left.w * 0.68, y + 92, { align: "center", color: roleColors.neutral, font: "800 18px Georgia, serif" });
      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Macroscopic property", property === "chemical" ? "Chemical properties stay similar." : "Physical properties can differ.", roleColors.resolution);
      drawText(property === "chemical" ? "same chemical behavior" : "different physical mass", l.topRight.x + 12, l.topRight.y + 90, { color: property === "chemical" ? roleColors.good : roleColors.highlight, font: "800 16px Andale Mono, Courier New, monospace", maxWidth: l.topRight.w - 24 });
      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Symbolic", "Isotopes are atoms of the same element.", roleColors.highlight);
      drawText("same Z = " + base.z, l.bottomRight.x + 12, l.bottomRight.y + 70, { color: roleColors.agent, font: "800 14px Andale Mono, Courier New, monospace" });
      drawText("different A = " + a1 + " / " + a2, l.bottomRight.x + 12, l.bottomRight.y + 96, { color: roleColors.problem, font: "800 14px Andale Mono, Courier New, monospace" });
      drawText("neutrons differ by " + diff, l.bottomRight.x + 12, l.bottomRight.y + 122, { color: roleColors.highlight, font: "800 14px Andale Mono, Courier New, monospace" });
      setMetric(String(base.z), "same protons", String(diff), "neutron difference", property, "property focus");
    }

    function drawRelativeMass() {
      const l = splitLayout();
      const abundance = Number(getValue("chlorine_35_abundance", 75));
      const mode = String(getValue("calculation_mode", "weighted_average"));
      const sample = Number(getValue("sample_size", 100));
      const ar = mode === "simple_average" ? 36 : (abundance * 35 + (100 - abundance) * 37) / 100;

        ctx.fillStyle = is35 ? roleColors.agent : roleColors.problem;

    }

    function drawMovingParticles(x, y, w, h, count, speed, success) {
      const box = { x: x + 8, y: y + 8, w: Math.max(20, w - 16), h: Math.max(20, h - 16) };
      ctx.save();
      ctx.beginPath();
      ctx.rect(box.x, box.y, box.w, box.h);
      ctx.clip();
      for (let i = 0; i < Math.min(72, count); i += 1) {
        const a = i * 2.399 + timeSeed * speed;
        const r = 0.3 + (i % 9) * 0.038;
        const px = box.x + box.w * (0.5 + Math.cos(a) * r);
        const py = box.y + box.h * (0.5 + Math.sin(a * 1.13) * r);
        ctx.fillStyle = i % Math.max(2, Math.round(10 - success * 7)) === 0 ? roleColors.highlight : (i % 2 ? roleColors.agent : roleColors.problem);
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawCollisionGate() {
      const l = splitLayout();
      const energy = Number(getValue("collision_energy", 55));

      const passOrient = orientation.indexOf("right") >= 0;
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Microscopic collision", "A collision must pass both gates.", roleColors.agent);
      const cx = l.left.x + l.left.w * 0.5;
      const cy = l.left.y + l.left.h * 0.55;
      const offset = 90 - Math.sin(timeSeed * freq) * 40;
      ctx.fillStyle = roleColors.agent;
      ctx.beginPath();
      ctx.arc(cx - offset, cy, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = roleColors.problem;
      ctx.beginPath();
      ctx.arc(cx + offset, cy, 26, 0, Math.PI * 2);
      ctx.fill();
      arrow(cx - offset + 38, cy, cx - 14, cy, roleColors.agent, 2.5);
      arrow(cx + offset - 38, cy, cx + 14, cy, roleColors.problem, 2.5);
      drawText(passEnergy && passOrient ? "products form" : "bounce apart", cx, cy + 80, { align: "center", color: passEnergy && passOrient ? roleColors.good : roleColors.problem, font: "800 20px Georgia, serif" });
      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Macroscopic count", "Only effective collisions increase product.", roleColors.resolution);
      drawText(passEnergy && passOrient ? "effective" : "ineffective", l.topRight.x + 12, l.topRight.y + 96, { color: passEnergy && passOrient ? roleColors.good : roleColors.problem, font: "800 24px Georgia, serif" });
      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Symbolic gates", "energy >= Ea AND right orientation", roleColors.highlight);

      ctx.lineWidth = 4;

      ctx.moveTo(gx, gy);
      ctx.bezierCurveTo(gx + gw * 0.25, gy - 110, gx + gw * 0.45, gy - l.left.h * peak, gx + gw * 0.55, gy - l.left.h * peak);

      drawMovingParticles(l.topRight.x, l.topRight.y + 36, l.topRight.w, l.topRight.h - 36, 42, rate, catalyst ? 0.9 : 0.4);

    function drawGeneric() {
      const l = splitLayout();
      panel(l.left.x, l.left.y, l.left.w, l.left.h, "Mechanism", spec.mechanism, roleColors.agent);
      drawMovingParticles(l.left.x, l.left.y + 40, l.left.w, l.left.h - 56, 42, 1.2, 0.55);
      panel(l.topRight.x, l.topRight.y, l.topRight.w, l.topRight.h, "Linked outcome", spec.transferable_principle, roleColors.resolution);
      drawGraph(l.topRight.x, l.topRight.y + 28, l.topRight.w, l.topRight.h - 28, 1.2, { tangentLabel: "linked change" });
      panel(l.bottomRight.x, l.bottomRight.y, l.bottomRight.w, l.bottomRight.h, "Symbolic", spec.steps.map(function(step) { return step.name; }).join(" -> "), roleColors.highlight);
      drawText(spec.topic, l.bottomRight.x + 12, l.bottomRight.y + 100, { color: roleColors.highlight, font: "800 22px Georgia, serif", maxWidth: l.bottomRight.w - 24 });
      setMetric("linked", "views", String(spec.controls.length), "controls", String(spec.scenarios.length), "scenarios");
    }

    function drawDomainScene() {
      const id = spec.id;
      if (id.indexOf("subatomic-particle-map") >= 0) return drawSubatomic();
      if (id.indexOf("electronic-configuration") >= 0) return drawElectronicConfig();
      if (id.indexOf("proton-nucleon") >= 0) return drawNotationReader();
      if (id.indexOf("sodium-cation") >= 0) return drawIonTransfer("cation");
      if (id.indexOf("chloride-anion") >= 0) return drawIonTransfer("anion");
      if (id.indexOf("isotope-properties") >= 0) return drawIsotopes();
      if (id.indexOf("relative-atomic-mass") >= 0) return drawRelativeMass();
      if (id.indexOf("og-element") >= 0) return drawOganesson();
      if (id.indexOf("two-minus-ion") >= 0) return drawTwoMinusIon();
      if (id.indexOf("measurement-gradient") >= 0) return drawRateMeasurement();
      if (id.indexOf("effective-collision") >= 0) return drawCollisionGate();
      if (id.indexOf("particle-size") >= 0) return drawSurfaceArea();
      if (id.indexOf("concentration") >= 0) return drawConcentration();
      if (id.indexOf("pressure") >= 0) return drawPressure();
      if (id.indexOf("temperature") >= 0) return drawTemperature();
      if (id.indexOf("catalyst") >= 0) return drawCatalyst();
      return drawGeneric();
    }

    function draw(time) {
      animationId = null;
      const delta = Math.min(0.04, Math.max(0.001, (time - lastTime) / 1000 || 0.016));
      lastTime = time;
      if (motion) timeSeed += delta;
      clearCanvas();
      drawDomainScene();
      if (!document.hidden) scheduleDraw();
    }

    function scheduleDraw() {
      if (animationId === null) animationId = requestAnimationFrame(draw);
    }

    window.addEventListener("resize", function() {
      resizeCanvas();
      scheduleDraw();
    });

    document.addEventListener("visibilitychange", function() {
      if (document.hidden && animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
      } else {
        lastTime = performance.now();
        scheduleDraw();
      }
    });

    resetValues();
    renderStatic();
    renderAll();
    resizeCanvas();
    scheduleDraw();
  </script>
</body>
</html>
